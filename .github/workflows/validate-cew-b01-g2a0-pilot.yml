name: CEW-B01 G2A0 Pilot Unit Gate

on:
  pull_request:
    paths:
      - 'experiments/cew_b01/g2a0_observation_bundles.py'
      - 'experiments/cew_b01/g2_composition_bundled_compare.py'
      - 'tests/cew_b01/test_g2a0_observation_bundles.py'
      - 'tests/cew_b01/test_g2_composition_bundled_compare.py'
      - 'governance/cew-b01/G2A0_EIGHT_SEED_RESULT_v1.json'
      - 'docs/experiments/2026-10-29-cew-b01-g2-composition-small-spike.md'
      - '.github/workflows/validate-cew-b01-g2a0-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2a0-pilot-unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Run G2A0 pilot unit contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.cew_b01.test_g2a0_observation_bundles \
            tests.cew_b01.test_g2_composition_bundled_compare -v
