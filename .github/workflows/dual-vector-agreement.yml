name: dual-vector-agreement

on:
  pull_request:
    paths:
      - 'scripts/cew_dual_vector_agreement.py'
      - 'scripts/build_cew_document_geometry_artifacts.py'
      - 'automation/CEW_DUAL_VECTOR_AGREEMENT_CONTRACT_v1.json'
      - 'docs/PROCEDURES/DUAL_VECTOR_GEOMETRY_REVALIDATION_v1.md'
      - '.github/workflows/dual-vector-agreement.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned vector extractors
        run: python -m pip install --upgrade 'PyMuPDF==1.28.2' 'docling-parse==7.16.0'
      - name: Static compile
        run: |
          python -m py_compile scripts/cew_dual_vector_agreement.py
          python -m py_compile scripts/build_cew_document_geometry_artifacts.py
      - name: Deterministic comparator self-test
        run: python scripts/cew_dual_vector_agreement.py --self-test
      - name: Validate document-geometry immutable source plan
        run: python scripts/build_cew_document_geometry_artifacts.py --validate-plan-only
      - name: Build synthetic vector PDF
        run: |
          python - <<'PY'
          import fitz
          doc = fitz.open()
          page = doc.new_page(width=300, height=200)
          shape = page.new_shape()
          shape.draw_rect(fitz.Rect(40, 40, 180, 120))
          shape.draw_line(fitz.Point(40, 80), fitz.Point(180, 80))
          shape.draw_line(fitz.Point(110, 40), fitz.Point(110, 120))
          shape.finish(color=(0, 0, 0), width=1)
          shape.commit()
          doc.save('/tmp/dual-vector-synthetic.pdf')
          doc.close()
          PY
      - name: Execute both extractors on same PDF
        run: |
          python scripts/cew_dual_vector_agreement.py \
            --pdf /tmp/dual-vector-synthetic.pdf \
            --page 1 \
            --output /tmp/dual-vector-result.json
          cat /tmp/dual-vector-result.json
      - name: Validate extractor compatibility
        run: |
          python - <<'PY'
          import json
          r = json.load(open('/tmp/dual-vector-result.json'))
          assert r['outcome'] in {'AGREE', 'PARTIAL', 'DISAGREE'}, r
          assert r['canonical_mutation'] is False
          assert r['extractors']['pymupdf'] == '1.28.2', r
          assert r['extractors']['docling_parse'] == '7.16.0', r
          assert r['segments']['reference_count'] > 0, r
          assert r['segments']['candidate_count'] > 0, r
          PY
      - name: Persist diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-vector-diagnostic
          path: /tmp/dual-vector-result.json
          if-no-files-found: warn
