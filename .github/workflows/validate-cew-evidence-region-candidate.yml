name: Validate CEW Evidence Region Candidate

on:
  pull_request:
    paths:
      - 'scripts/cew_evidence_region_candidate.py'
      - 'scripts/validate_cew_evidence_region_candidate.py'
      - 'automation/CEW_EVIDENCE_REGION_CANDIDATE_MODEL_v1.json'
      - 'automation/outbox/CEW_B16_EVIDENCE_REGION_CANDIDATE_TASK_v1.json'
      - 'docs/PRODUCT/CEW_EVIDENCE_REGION_CANDIDATE_V1_CONTRACT.md'
      - 'migrations/cew/004_evidence_region_candidate_audit_PROPOSED_NOT_APPLIED.sql'
      - 'data/canonical/CEW_PAGE_REGISTRY_v1.csv'
      - '.github/workflows/validate-cew-evidence-region-candidate.yml'

jobs:
  validate-evidence-region-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile scripts/cew_evidence_region_candidate.py
          python -m py_compile scripts/validate_cew_evidence_region_candidate.py
      - name: Validate candidate geometry and authority boundary
        run: python scripts/validate_cew_evidence_region_candidate.py
      - name: Declare promotion boundary
        run: |
          echo 'Candidate is EvidenceRegion: false'
          echo 'Current F2 registry write: false'
          echo 'Observation auto-create: false'
          echo 'Structural binding auto-create: false'
          echo 'Production candidate migration applied: false'
