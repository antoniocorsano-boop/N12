name: ETW2 G1 G2 Registration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/structural-professional-workspace-r1
    paths:
      - 'model/etwin/floor_pair_registration.py'
      - 'model/etwin/document_registry.py'
      - 'archive/documentazione_originaria/tavola2-2.pdf'
      - 'archive/documentazione_originaria/tavola3-2.pdf'
      - '.github/workflows/etw2-g1-g2-registration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/etwin/floor_pair_registration.py'
      - 'model/etwin/document_registry.py'
      - 'archive/documentazione_originaria/tavola2-2.pdf'
      - 'archive/documentazione_originaria/tavola3-2.pdf'
      - '.github/workflows/etw2-g1-g2-registration.yml'

jobs:
  register-g1-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pypdfium2 Pillow opencv-python-headless numpy

      - name: Register G1 to G2
        run: >-
          python -m model.etwin.floor_pair_registration
          --source-level G1 --source-id TAV-02S
          --target-level G2 --target-id TAV-03S
          --out docs/FOGLIO_LAVORO/etwin_crops/ETW-2/G1_G2_registered

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          root='docs/FOGLIO_LAVORO/etwin_crops/ETW-2/G1_G2_registered'
          test -f "$root/registration_result.json"
          test -f "$root/difference_candidates.json"
          test -f "$root/TARGET.png"
          test -f "$root/SOURCE_REGISTERED_TO_TARGET.png"
          test -f "$root/ABSDIFF.png"
          test -f "$root/DIFF_THRESHOLD.png"

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: etw2-g1-g2-registered
          path: docs/FOGLIO_LAVORO/etwin_crops/ETW-2/G1_G2_registered/
          retention-days: 14
