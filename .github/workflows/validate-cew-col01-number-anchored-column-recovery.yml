name: CEW-COL-01 Number-Anchored Column Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cew-col01-number-anchored-column-recovery.yml'
      - 'experiments/cew_col01/**'
      - 'tests/cew_col01/**'
      - 'docs/experiments/2026-10-30-cew-col01-number-anchored-column-recovery-design.md'
      - 'docs/superpowers/plans/2026-10-30-cew-col01-number-anchored-column-recovery.md'
      - 'governance/cew-col01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Run COL-01 unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/cew_col01 -p 'test_*.py' -v

  exact-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Install frozen Tesseract system package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'

      - name: Install frozen B01 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cew-col01"
          source "$RUNNER_TEMP/cew-col01/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/cew-b01.lock.txt
          python -m pip check

      - name: Fetch frozen archival source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9

      - name: Execute exact TAV.5 COL-01 audit
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-col01/bin/activate"
          python -m experiments.cew_col01.exact_source_audit

      - name: Upload COL-01 evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-col01-number-anchored-column-recovery
          path: evidence/cew-col01/number-anchored-column-recovery/
          if-no-files-found: error
          retention-days: 30
