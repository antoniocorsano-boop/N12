name: CEW-COL-03F Primary Identity Bridge Evidence

on:
  pull_request:
    branches:
      - feat/cew-col03e-governed-structural-identity-adjudication
    paths:
      - 'experiments/cew_col03f/**'
      - 'tests/cew_col03f/**'
      - '.github/workflows/validate-cew-col03f-primary-identity-bridge-evidence.yml'
      - 'docs/superpowers/specs/2026-11-01-cew-col03f-primary-identity-bridge-evidence-design.md'
      - 'docs/superpowers/plans/2026-11-01-cew-col03f-primary-identity-bridge-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate and qualified COL-03E ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor cbf57e9261228a7376df826baadc79abe2da254c HEAD
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Run COL-03F unit contracts
        run: python -m unittest discover -s tests/cew_col03f -p 'test_*.py' -v
