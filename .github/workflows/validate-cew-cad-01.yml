name: CEW-CAD-01 Qualification

on:
  pull_request:
    branches:
      - main
      - feat/cew-cad-01-controlled-ai-gateway
  push:
    branches:
      - fix/cew-cad-01-live-contract-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: CEW-CAD-01 Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CEW-CAD direct dependencies in clean runner
        run: python -m pip install -r requirements/cew-cad.lock
      - name: Task 1 core contract tests
        run: python -m unittest tests/cew_cad_gateway/test_types_and_canonical.py -v
      - name: Task 2 workspace confinement tests
        run: python -m unittest tests/cew_cad_gateway/test_policy_workspace.py -v
      - name: Task 3 adapter contract and OCS handshake tests
        run: python -m unittest tests/cew_cad_gateway/test_adapter_contract.py tests/cew_cad_gateway/test_opencadstudio_adapter.py -v
      - name: Task 4 read-only inspection tests
        run: python -m unittest tests/cew_cad_gateway/test_inspection.py -v
      - name: Task 5 governed changeset tests
        run: python -m unittest tests/cew_cad_gateway/test_changesets.py -v
      - name: Task 6 signed human approval tests
        run: python -m unittest tests/cew_cad_gateway/test_approval.py -v
      - name: Task 7 stale-state idempotency and typed OCS compiler tests
        run: python -m unittest tests/cew_cad_gateway/test_execution.py tests/cew_cad_gateway/test_opencadstudio_mutation_compiler.py -v
      - name: Task 8 technical verification and verified-copy tests
        run: python -m unittest tests/cew_cad_gateway/test_verification.py -v
      - name: Task 9 exact MCP surface tests
        run: python -m unittest tests/cew_cad_gateway/test_mcp_surface.py -v
      - name: Task 10 full fake-chain qualification tests
        run: python -m unittest tests/cew_cad_gateway/test_end_to_end_fake.py -v
      - name: Full CEW-CAD-01 suite
        run: python -m unittest discover -s tests/cew_cad_gateway -p 'test_*.py' -v
      - name: Compile gateway package
        run: python -m compileall -q cew_cad_gateway

  windows-durability:
    name: CEW-CAD-01 Windows Durability
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CEW-CAD direct dependencies in clean runner
        run: python -m pip install -r requirements/cew-cad.lock
      - name: Windows durable directory flush contract
        run: python -m unittest tests.cew_cad_gateway.test_durable_approval_fail_closed.DurableApprovalFailClosedTests.test_windows_native_directory_flush_succeeds tests.cew_cad_gateway.test_durable_approval_fail_closed.DurableApprovalFailClosedTests.test_windows_directory_flush_requests_generic_write_access -v
