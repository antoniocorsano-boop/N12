name: Validate CEW Platform OS

on:
  push:
    branches: [exp/cew-platform-os-v0]
    paths:
      - 'docs/ARCHITECTURE/CEW_PLATFORM_OS_v0.md'
      - 'docs/ARCHITECTURE/CEW_OPEN_SOURCE_ADOPTION_MATRIX_v0.md'
      - 'docs/AGENTS/CEW_COMMUNICATION_PROTOCOL_v0.md'
      - 'automation/CEW_PLATFORM_WORK_QUEUE_v0.json'
      - 'automation/CEW_PLATFORM_WORK_STATE_v0.json'
      - 'automation/CEW_EXECUTION_POLICY_v0.json'
      - 'automation/CEW_AGENT_CAPABILITY_REGISTRY_v0.json'
      - 'automation/CEW_AGENT_RESULT_CONTRACT_v0.json'
      - 'automation/CEW_CHECKPOINT_CONTRACT_v0.json'
      - 'automation/receipts/**'
      - 'scripts/cew_platform_orchestrator.py'
      - 'tests/test_cew_platform_orchestrator.py'
      - 'tools/cew_docintel/**'
      - '.github/workflows/validate-cew-platform-os.yml'
  pull_request:
    paths:
      - 'docs/ARCHITECTURE/CEW_PLATFORM_OS_v0.md'
      - 'docs/ARCHITECTURE/CEW_OPEN_SOURCE_ADOPTION_MATRIX_v0.md'
      - 'docs/AGENTS/CEW_COMMUNICATION_PROTOCOL_v0.md'
      - 'automation/CEW_PLATFORM_WORK_QUEUE_v0.json'
      - 'automation/CEW_PLATFORM_WORK_STATE_v0.json'
      - 'automation/CEW_EXECUTION_POLICY_v0.json'
      - 'automation/CEW_AGENT_CAPABILITY_REGISTRY_v0.json'
      - 'automation/CEW_AGENT_RESULT_CONTRACT_v0.json'
      - 'automation/CEW_CHECKPOINT_CONTRACT_v0.json'
      - 'automation/receipts/**'
      - 'scripts/cew_platform_orchestrator.py'
      - 'tests/test_cew_platform_orchestrator.py'
      - 'tools/cew_docintel/**'
      - '.github/workflows/validate-cew-platform-os.yml'

jobs:
  platform-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate platform contracts and runtime state
        run: python scripts/cew_platform_orchestrator.py validate
      - name: Validate completion receipts
        run: python scripts/cew_platform_orchestrator.py validate-receipts
      - name: Validate adaptive planning and result/checkpoint invariants
        run: python -m unittest discover -s tests -p 'test_cew_platform_orchestrator.py' -v
      - name: Show effective runtime state
        run: python scripts/cew_platform_orchestrator.py runtime-state
      - name: Show current lock-safe execution plan
        run: python scripts/cew_platform_orchestrator.py plan
      - name: Exercise next work result template
        run: python scripts/cew_platform_orchestrator.py result-template DOC-001
      - name: Exercise next work checkpoint template
        run: python scripts/cew_platform_orchestrator.py checkpoint-template DOC-001
      - name: Validate inherited document-intelligence foundation
        run: python -m unittest discover -s tools/cew_docintel/tests -v
      - name: Validate inherited document-intelligence store contract
        run: python tools/cew_docintel/cli.py --db /tmp/docintel.sqlite3 validate

# Canonical promotion remains disabled. This workflow validates only the experimental Platform OS execution layer.
