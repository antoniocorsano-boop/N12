name: Render N12 HiRes Sources

on:
  push:
    branches: [work/m0g-source-recovery]
    paths:
      - 'scripts/render_hires_sources.py'
      - '.github/workflows/render-hires.yml'
      - 'docs/PROTOCOLLO_LETTURA_TAVOLE_HIRES.md'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render_hires_sources.py'
      - '.github/workflows/render-hires.yml'
      - 'docs/PROTOCOLLO_LETTURA_TAVOLE_HIRES.md'
      - 'data/canonical/hires_reading_registry.csv'
      - 'data/canonical/hires_evidence_log.csv'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: pip install pymupdf pillow
      - name: Render TAV-03S G2 native source and tiles
        run: python scripts/render_hires_sources.py --source TAV-03S --out artifacts/TAV-03S --tile-size 2400 --overlap 0.125
      - name: Render TAV-06S G5 native source and tiles
        run: python scripts/render_hires_sources.py --source TAV-06S --out artifacts/TAV-06S --tile-size 2400 --overlap 0.125
      - name: Record adjacent-level source hashes
        run: |
          python - <<'PY'
          import json,sys
          for sid in ('TAV-03S','TAV-06S'):
            p=json.load(open(f'artifacts/{sid}/hires_index.json'))
            if len(p['sources']) != 1 or p['sources'][0]['source_id'] != sid:
              print('SOURCE_SET_MISMATCH',sid,p['sources']); sys.exit(1)
            s=p['sources'][0]
            print(sid+'_PDF_SHA256='+s['pdf_sha256'])
            print(sid+'_RASTER_SHA256='+s['raster_sha256'])
            print(sid+'_DIMENSIONS='+str(s['width'])+'x'+str(s['height']))
          print('SOURCE_HASH_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n12-hires-g2-g5
          path: artifacts
          retention-days: 30
