name: Render N12 HiRes Sources

on:
  push:
    branches: [work/m0g-source-recovery]
    paths:
      - 'scripts/render_hires_sources.py'
      - '.github/workflows/render-hires.yml'
      - 'docs/PROTOCOLLO_LETTURA_TAVOLE_HIRES.md'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render_hires_sources.py'
      - '.github/workflows/render-hires.yml'
      - 'docs/PROTOCOLLO_LETTURA_TAVOLE_HIRES.md'
      - 'data/canonical/hires_reading_registry.csv'
      - 'data/canonical/hires_evidence_log.csv'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: pip install pymupdf pillow
      - name: Render TAV-04S native source and tiles
        run: python scripts/render_hires_sources.py --source TAV-04S --out artifacts/hires --tile-size 2400 --overlap 0.125
      - name: Record TAV-04S source hash
        run: |
          python - <<'PY'
          import json,sys
          p=json.load(open('artifacts/hires/hires_index.json'))
          if len(p['sources']) != 1 or p['sources'][0]['source_id'] != 'TAV-04S':
            print('SOURCE_SET_MISMATCH',p['sources']); sys.exit(1)
          s=p['sources'][0]
          print('TAV04S_PDF_SHA256='+s['pdf_sha256'])
          print('TAV04S_RASTER_SHA256='+s['raster_sha256'])
          print('TAV04S_DIMENSIONS='+str(s['width'])+'x'+str(s['height']))
          print('SOURCE_HASH_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n12-hires-tav04s
          path: artifacts/hires
          retention-days: 30
