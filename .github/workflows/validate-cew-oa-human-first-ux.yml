name: Validate CEW OA Human-First UX

on:
  pull_request:
    paths:
      - 'scripts/cew_oa1_workbench_runtime.py'
      - 'scripts/cew_oa2_workbench_runtime.py'
      - 'scripts/cew_oa3_workbench_runtime.py'
      - 'scripts/cew_oa4_workbench_runtime.py'
      - 'scripts/cew_professional_workbench_client.py'
      - 'scripts/validate_cew_oa_human_first_ux.py'
      - 'automation/CEW_OA_HUMAN_FIRST_UX_CONTRACT_v1.json'
      - 'automation/CEW_OBJECT_ACQUISITION_QUEUE_v1.json'
      - 'scripts/render_build_candidate.sh'
      - '.github/workflows/validate-cew-oa-human-first-ux.yml'
  push:
    branches:
      - work/cew-oa5-structural-resolver-v1
    paths:
      - 'scripts/cew_oa1_workbench_runtime.py'
      - 'scripts/cew_oa2_workbench_runtime.py'
      - 'scripts/cew_oa3_workbench_runtime.py'
      - 'scripts/cew_oa4_workbench_runtime.py'
      - 'scripts/cew_professional_workbench_client.py'
      - 'scripts/validate_cew_oa_human_first_ux.py'
      - 'automation/CEW_OA_HUMAN_FIRST_UX_CONTRACT_v1.json'
      - 'automation/CEW_OBJECT_ACQUISITION_QUEUE_v1.json'
      - 'scripts/render_build_candidate.sh'
      - '.github/workflows/validate-cew-oa-human-first-ux.yml'
  workflow_dispatch:

jobs:
  validate-oa-human-first-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: |
          python -m py_compile \
            scripts/cew_oa1_workbench_runtime.py \
            scripts/cew_oa2_workbench_runtime.py \
            scripts/cew_oa3_workbench_runtime.py \
            scripts/cew_oa4_workbench_runtime.py \
            scripts/validate_cew_oa_human_first_ux.py
      - name: Validate OA human-first interaction contract
        run: python scripts/validate_cew_oa_human_first_ux.py
