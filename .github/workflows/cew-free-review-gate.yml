name: CEW Free Review Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-cew-review:
    name: Deterministic CEW governance review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CEW invariant reviewer
        run: python scripts/validate_cew_free_review_gate.py

  semgrep-community-review:
    name: Semgrep Community CEW review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep Community
        run: |
          python -m pip install --disable-pip-version-check 'semgrep<2'
          semgrep --version
      - name: Run local CEW Semgrep rules
        run: semgrep scan --config .semgrep/cew-governance.yml --error --metrics=off automation netlify/functions scripts sql

  codeql-review:
    name: CodeQL security analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/cew-config.yml
      - name: Analyze and publish security alerts
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
