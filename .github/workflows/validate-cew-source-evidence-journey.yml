name: Validate CEW Source Evidence Journey

on:
  pull_request:
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'scripts/cew_source_evidence_workspace.py'
      - 'scripts/cew_project_home.py'
      - 'scripts/build_cew_canonical_patch_candidates.py'
      - 'scripts/validate_cew_source_evidence_journey.py'
      - 'automation/CEW_F7_PATCH_PAYLOAD_CONTRACT_v1.json'
      - 'automation/CEW_TERMINOLOGY_LAYER_v1.json'
      - 'docs/PRODUCT/CEW_SOURCE_HUB_V1_CONTRACT.md'
      - 'docs/PRODUCT/CEW_EVIDENCE_WORKSPACE_V1_CONTRACT.md'
      - 'data/canonical/tavole_originali_remote_index_v1.csv'
      - 'data/canonical/CEW_PAGE_REGISTRY_v1.csv'
      - 'data/canonical/CEW_PAGE_TRANSFORM_REGISTRY_v1.csv'
      - 'data/canonical/CEW_EVIDENCE_REGION_REGISTRY_v1.csv'
      - 'data/canonical/CEW_SOURCE_VIEWER_BINDINGS_v1.csv'
      - 'data/canonical/CEW_DERIVED_ASSET_REGISTRY_v1.csv'
      - 'data/canonical/CEW_ERW_RESOLUTION_TASKS_v1.csv'
      - '.github/workflows/validate-cew-source-evidence-journey.yml'
  workflow_dispatch:

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CEW runtime
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile app.py
          python -m py_compile scripts/cew_source_evidence_workspace.py
          python -m py_compile scripts/build_cew_canonical_patch_candidates.py
          python -m py_compile scripts/validate_cew_source_evidence_journey.py
      - name: Validate governed Source Evidence Journey
        run: python scripts/validate_cew_source_evidence_journey.py
      - name: Authenticated B1 browser smoke without fabricated receipt
        env:
          CEW_ACCESS_PASSWORD: b1-test-password
          CEW_SESSION_SECRET: b1-test-session-secret-at-least-32-bytes
          CEW_LOCAL_AUDIT_DIR: /tmp/cew-b1-audit
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8766 >/tmp/cew-b1.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8766/healthz >/tmp/b1-health.json && break
            sleep 1
          done
          python - <<'PY'
          import json
          h=json.load(open('/tmp/b1-health.json'))
          assert h['service']=='CEW_USER_RUNTIME'
          assert h['source_workspace']=='B1_AVAILABLE'
          assert h['source_integrity_policy']=='IMMUTABLE_COMMIT_PLUS_SHA256_FAIL_CLOSED'
          assert h['canonical_write_authorized'] is False
          PY
          CODE=$(curl -sS -c /tmp/b1-cookies.txt -o /tmp/b1-login.out -w '%{http_code}' -X POST -d 'password=b1-test-password' http://127.0.0.1:8766/login)
          test "$CODE" = "303"
          curl -fsS -b /tmp/b1-cookies.txt http://127.0.0.1:8766/ >/tmp/b1-home.html
          grep -q 'href=.*/sources' /tmp/b1-home.html
          curl -fsS -b /tmp/b1-cookies.txt http://127.0.0.1:8766/sources >/tmp/b1-sources.html
          grep -q 'Fonti del progetto' /tmp/b1-sources.html
          grep -q 'Fonte primaria immutabile' /tmp/b1-sources.html
          grep -q 'TAV-05A' /tmp/b1-sources.html
          curl -fsS -b /tmp/b1-cookies.txt http://127.0.0.1:8766/sources/TAV-05A >/tmp/b1-source-detail.html
          grep -q 'Apri PDF verificato' /tmp/b1-source-detail.html
          grep -q 'Apri Evidence Workspace' /tmp/b1-source-detail.html
          curl -fsS -b /tmp/b1-cookies.txt 'http://127.0.0.1:8766/evidence/review?task=ERW-N12-001' >/tmp/b1-evidence.html
          grep -q 'EVIDENCE WORKSPACE' /tmp/b1-evidence.html
          grep -q 'MICRO' /tmp/b1-evidence.html
          grep -q 'MESO' /tmp/b1-evidence.html
          grep -q 'MACRO' /tmp/b1-evidence.html
          grep -q 'linguaggio tecnico naturale' /tmp/b1-evidence.html
          grep -q 'Invia revisione a CEW' /tmp/b1-evidence.html
          echo 'CEW B1 AUTHENTICATED USER JOURNEY: PASS'
