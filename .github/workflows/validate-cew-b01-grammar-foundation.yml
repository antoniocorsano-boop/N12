name: CEW-B01 Grammar Foundation Exact-Source Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cew-b01-grammar-foundation.yml'
      - 'cew_b01/grammar_schema.py'
      - 'cew_b01/document_zoning.py'
      - 'cew_b01/zone_review_package.py'
      - 'cew_b01/primitive_census.py'
      - 'cew_b01/motif_catalog.py'
      - 'cew_b01/grammar_review_package.py'
      - 'governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json'
      - 'governance/cew-b01/N12_TAV5_SOURCE_v1.json'
      - 'requirements/cew-b01.lock.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-grammar-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Install frozen Tesseract system package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'

      - name: Install frozen B01 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cew-b01-grammar-foundation"
          source "$RUNNER_TEMP/cew-b01-grammar-foundation/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/cew-b01.lock.txt
          python -m pip check

      - name: Fetch frozen archival source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9

      - name: Execute exact-TAV5 G0-G2 grammar foundation twice
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-b01-grammar-foundation/bin/activate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          from cew_b01.document_zoning import propose_document_zones
          from cew_b01.evidence_schema import Task3RasterBinding
          from cew_b01.grammar_review_package import render_grammar_foundation_review_package
          from cew_b01.motif_catalog import build_recurring_motif_catalog
          from cew_b01.pdf_probe import probe_pdf
          from cew_b01.primitive_census import extract_neutral_primitives
          from cew_b01.source_contract import load_source_contract, materialize_source
          from cew_b01.zone_review_package import confirmed_zones_from_receipt, zone_set_digest

          def digest_payload(payload):
              raw = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          contract = load_source_contract('governance/cew-b01/N12_TAV5_SOURCE_v1.json')
          materialized = materialize_source(contract, '.', runner_temp / 'tavola5-grammar-source.pdf')
          step3_dir = runner_temp / 'cew-b01-grammar-task3-input'
          probe = probe_pdf(materialized, step3_dir)
          binding = Task3RasterBinding.from_probe_mapping(probe.to_mapping())
          raster_path = step3_dir / 'tav5-page0-300dpi.png'

          proposed_zones = propose_document_zones(binding, raster_path)
          receipt = json.loads(Path('governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json').read_text(encoding='utf-8'))
          zones = confirmed_zones_from_receipt(binding, proposed_zones, receipt)
          assert all(zone.human_confirmed for zone in zones)
          assert zone_set_digest(zones) == receipt['zone_set_digest']

          primitives_a = extract_neutral_primitives(binding, raster_path, zones)
          primitives_b = extract_neutral_primitives(binding, raster_path, zones)
          primitive_payload_a = [item.to_mapping() for item in primitives_a]
          primitive_payload_b = [item.to_mapping() for item in primitives_b]
          primitive_digest_a = digest_payload(primitive_payload_a)
          primitive_digest_b = digest_payload(primitive_payload_b)
          assert primitive_digest_a == primitive_digest_b, 'G1 exact-source replay is nondeterministic'
          assert [item.primitive_id for item in primitives_a] == [item.primitive_id for item in primitives_b]
          assert all(item.semantic_meaning is None for item in primitives_a)
          assert all(item.structural_identity_authorized is False for item in primitives_a)
          assert all(item.canonical_write_authorized is False for item in primitives_a)

          motifs_a = build_recurring_motif_catalog(primitives_a)
          motifs_b = build_recurring_motif_catalog(primitives_b)
          motif_payload_a = [item.to_mapping() for item in motifs_a]
          motif_payload_b = [item.to_mapping() for item in motifs_b]
          motif_digest_a = digest_payload(motif_payload_a)
          motif_digest_b = digest_payload(motif_payload_b)
          assert motif_digest_a == motif_digest_b, 'G2 exact-source replay is nondeterministic'
          assert [item.motif_id for item in motifs_a] == [item.motif_id for item in motifs_b]
          assert all(item.semantic_meaning is None for item in motifs_a)
          assert all(item.structural_identity_authorized is False for item in motifs_a)
          assert all(item.canonical_write_authorized is False for item in motifs_a)

          output_dir = Path('evidence/cew-b01/grammar-foundation')
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / 'primitive-census.json').write_text(
              json.dumps(primitive_payload_a, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          (output_dir / 'motif-catalog.json').write_text(
              json.dumps(motif_payload_a, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          review_result = render_grammar_foundation_review_package(
              binding,
              raster_path,
              zones,
              primitives_a,
              motifs_a,
              output_dir,
          )
          review_manifest = json.loads(Path(review_result['manifest_path']).read_text(encoding='utf-8'))
          assert review_manifest['review_state'] == 'PENDING_HUMAN_MOTIF_REVIEW'
          assert review_manifest['g0_g2_engineering_pass'] is True
          assert review_manifest['authority']['structural_identity_authorized'] is False
          assert review_manifest['authority']['canonical_write_authorized'] is False
          assert review_manifest['authority']['engineering_authority_effect'] == 'NONE'
          assert review_manifest['coverage']['unaccounted_is_review_item'] is True

          family_counts = Counter(item.family.value for item in primitives_a)
          summary = {
              'step': 'CEW-B01-G0-G2-GRAMMAR-FOUNDATION',
              'source_sha256': materialized.sha256,
              'page_index': contract.page_index,
              'raster_sha256': binding.raster_sha256,
              'raster_png_sha256': binding.png_sha256,
              'zone_set_digest': zone_set_digest(zones),
              'reviewer_decision_id': receipt['reviewer_decision_id'],
              'g0_document_zoning_pass': True,
              'primitive_count': len(primitives_a),
              'primitive_family_counts': dict(sorted(family_counts.items())),
              'primitive_census_sha256': primitive_digest_a,
              'motif_count': len(motifs_a),
              'motif_catalog_sha256': motif_digest_a,
              'unknown_motif_count': review_manifest['motifs']['unknown_motif_count'],
              'workarea_ink_pixels': review_manifest['coverage']['workarea_ink_pixels'],
              'accounted_ink_pixels': review_manifest['coverage']['accounted_ink_pixels'],
              'unaccounted_ink_pixels': review_manifest['coverage']['unaccounted_ink_pixels'],
              'accounted_ink_ratio': review_manifest['coverage']['accounted_ink_ratio'],
              'review_state': review_manifest['review_state'],
              'g0_g2_engineering_pass': True,
              'structural_identity_authorized': False,
              'canonical_write_authorized': False,
              'historical_object_oracle_used': False,
          }
          (output_dir / 'qualification-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print('GRAMMAR_FOUNDATION_QUALIFICATION=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload exact grammar-foundation review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-b01-grammar-foundation-review
          path: evidence/cew-b01/grammar-foundation/
          if-no-files-found: error
          retention-days: 30
