name: Validate CEW Knowledge Graph M0-G Slice

on:
  pull_request:
    paths:
      - 'automation/CEW_KNOWLEDGE_GRAPH_CONTRACT_v1.json'
      - 'data/canonical/M0G_GEOMETRY_HANDOFF_v1.json'
      - 'data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv'
      - 'data/canonical/CEW_SYSTEM_MILESTONES_v1.csv'
      - 'knowledge/KNOWLEDGE_MANIFEST.json'
      - 'knowledge/ARTIFACT_REGISTRY_CEW_KNOWLEDGE_GRAPH_PATCH_v1.csv'
      - 'scripts/project_cew_m0g_knowledge_graph.py'
      - 'scripts/validate_cew_knowledge_graph_m0g_slice.py'
      - 'scripts/validate_cew_system_foundation.py'
      - '.github/workflows/validate-cew-knowledge-graph-m0g.yml'
  push:
    branches:
      - 'work/cew-f5-knowledge-graph-from-e7c0'
    paths:
      - 'automation/CEW_KNOWLEDGE_GRAPH_CONTRACT_v1.json'
      - 'data/canonical/M0G_GEOMETRY_HANDOFF_v1.json'
      - 'data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv'
      - 'data/canonical/CEW_SYSTEM_MILESTONES_v1.csv'
      - 'knowledge/KNOWLEDGE_MANIFEST.json'
      - 'knowledge/ARTIFACT_REGISTRY_CEW_KNOWLEDGE_GRAPH_PATCH_v1.csv'
      - 'scripts/project_cew_m0g_knowledge_graph.py'
      - 'scripts/validate_cew_knowledge_graph_m0g_slice.py'
      - 'scripts/validate_cew_system_foundation.py'
      - '.github/workflows/validate-cew-knowledge-graph-m0g.yml'
  workflow_dispatch:

jobs:
  m0g-graph-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CEW milestone governance
        run: python scripts/validate_cew_system_foundation.py
      - name: Project frozen M0-G members into graph
        run: python scripts/project_cew_m0g_knowledge_graph.py --out cew-f5-m0g-graph
      - name: Validate M0-G graph projection without authority loss
        run: python scripts/validate_cew_knowledge_graph_m0g_slice.py --projection cew-f5-m0g-graph/m0g_graph_projection.json
      - name: Upload M0-G graph projection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cew-f5-m0g-graph
          path: cew-f5-m0g-graph/
          if-no-files-found: error
          retention-days: 14
