name: CEW-B01 Step 5 Human Review Contract

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cew-b01-step5.yml'
      - 'cew_b01/**'
      - 'governance/cew-b01/N12_TAV5_SOURCE_v1.json'
      - 'governance/cew-b01/EXTERNAL_TOOLCHAIN_v1.json'
      - 'governance/cew-b01/schemas/B01_REVIEW_DECISION_v1.schema.json'
      - 'requirements/cew-b01.lock.txt'
      - 'tests/cew_b01/test_object_mapping.py'
      - 'tests/cew_b01/test_historical_comparator_boundary.py'
      - 'tests/cew_b01/test_review_package.py'

permissions:
  contents: read

jobs:
  verify-step5-review-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Install frozen Tesseract system package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'
          tesseract --version | head -n 1 | grep -F 'tesseract 5.3.4'

      - name: Install frozen B01 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cew-b01-step5"
          source "$RUNNER_TEMP/cew-b01-step5/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/cew-b01.lock.txt
          python -m pip check

      - name: Run Step 5 contract tests
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-b01-step5/bin/activate"
          python -m unittest \
            tests.cew_b01.test_object_mapping \
            tests.cew_b01.test_historical_comparator_boundary \
            tests.cew_b01.test_review_package -v

      - name: Fetch frozen archival source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9

      - name: Materialize source-derived V3 human review package
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-b01-step5/bin/activate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from cew_b01.evidence_extraction import evidence_bundle_mapping, extract_g4_evidence_candidates
          from cew_b01.evidence_schema import Task3RasterBinding
          from cew_b01.pdf_probe import probe_pdf
          from cew_b01.review_package import render_review_package
          from cew_b01.source_contract import load_source_contract, materialize_source

          EXPECTED_STEP4_CANDIDATE_COUNT = 364
          EXPECTED_STEP4_SET_SHA256 = 'af24687151738259188062fe84f77533cfb17dc830f5fe4c698933433fb61673'
          EXPECTED_STEP4_BUNDLE_SHA256 = 'd47c0cb1f5018ff71c268fc944dbf0a4ca790c29775d9d09278127ec55e98da3'
          EXPECTED_METHOD = 'OPENCV_DRAWING_GRAMMAR_CANDIDATE_UNION_V3'

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          contract = load_source_contract('governance/cew-b01/N12_TAV5_SOURCE_v1.json')
          materialized = materialize_source(
              contract,
              '.',
              runner_temp / 'tavola5-step5-source.pdf',
          )
          probe_dir = runner_temp / 'cew-b01-step5-task3-input'
          probe = probe_pdf(materialized, probe_dir)
          binding = Task3RasterBinding.from_probe_mapping(probe.to_mapping())
          raster_path = probe_dir / 'tav5-page0-300dpi.png'
          candidates = extract_g4_evidence_candidates(binding, raster_path)
          evidence_bundle = evidence_bundle_mapping(binding, candidates)

          ordered_identity_payload = json.dumps(
              [
                  {'candidate_id': item.candidate_id, 'geometry_digest': item.geometry_digest}
                  for item in candidates
              ],
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8')
          candidate_set_sha256 = hashlib.sha256(ordered_identity_payload).hexdigest()
          assert len(candidates) == EXPECTED_STEP4_CANDIDATE_COUNT
          assert candidate_set_sha256 == EXPECTED_STEP4_SET_SHA256
          assert evidence_bundle['bundle_sha256'] == EXPECTED_STEP4_BUNDLE_SHA256
          assert evidence_bundle['extraction']['method'] == EXPECTED_METHOD
          channel_ids = {
              item['capability_id']
              for item in evidence_bundle['extraction']['proposal_channels']
          }
          assert channel_ids == {
              'CEW-CAP-B01-V2-COMPOUND-CELL-DETECTOR',
              'CEW-CAP-B01-CLOSED-FRAME-INTERNAL-MARK-SPIKE',
          }
          reconciliation = evidence_bundle['reconciliation_provenance']
          assert reconciliation['oa3_similarity']['source_ref'] == 'a7020bef3934156c917f5bfe975d888c6ba9e684'
          assert reconciliation['structured_descriptor']['source_ref'] == '320755e66a7263f1842f73dc14fb9a0ea8ccd7f8'
          assert reconciliation['engineering_grammar']['source_ref'] == '098f98d2724c0a16b9293adc366a585f356bc9fc'
          assert reconciliation['oa3_similarity']['execution_state'] == 'AVAILABLE_REQUIRES_HUMAN_TAUGHT_PROTOTYPE'
          assert evidence_bundle['authority']['structural_identity_authorized'] is False
          assert evidence_bundle['authority']['canonical_write_authorized'] is False

          output_dir = Path('evidence/cew-b01/g4/step5-human-review')
          package = render_review_package(raster_path, candidates, output_dir)
          decision_path = Path('evidence/cew-b01/g4/CEW_B01_G4_REVIEW_DECISIONS_v1.json')
          assert not decision_path.exists(), 'human review decisions must not be synthesized by CI'

          summary = {
              'step': 'CEW-B01-TASK-5-PRE-HUMAN',
              'source_sha256': materialized.sha256,
              'candidate_count': len(candidates),
              'candidate_set_sha256': candidate_set_sha256,
              'evidence_bundle_sha256': evidence_bundle['bundle_sha256'],
              'method': EXPECTED_METHOD,
              'proposal_channels': evidence_bundle['extraction']['proposal_channels'],
              'reconciliation_provenance': reconciliation,
              'review_state': 'PENDING_HUMAN',
              'review_decisions_file_created': False,
              'structural_candidates_created': 0,
              'canonical': False,
              'structural_identity_authorized': False,
              'canonical_write_authorized': False,
              'historical_comparator_loaded': False,
              'overview': Path(package['overview_path']).name,
              'contact_sheet_count': len(package['contact_sheet_paths']),
              'manifest': Path(package['manifest_path']).name,
          }
          (output_dir / 'qualification-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('STEP5_PRE_HUMAN_QUALIFICATION=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload Step 5 human review package
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-b01-step5-human-review-package
          path: evidence/cew-b01/g4/step5-human-review/
          if-no-files-found: error
          retention-days: 30
