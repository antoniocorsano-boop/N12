name: Validate CEW Visual Learning

on:
  push:
    branches:
      - work/cew-new-project-preacquisition-v1
    paths:
      - 'analysis/cew/CEW_VISUAL_LEARNING_ARCHITECTURE_v1.md'
      - 'automation/CEW_VISUAL_LEARNING_CONTRACT_v1.json'
      - 'automation/CEW_VISUAL_LEARNING_IMPLEMENTATION_STATUS_v1.json'
      - 'automation/CEW_DINOV3_PROVIDER_CONTRACT_v1.json'
      - 'scripts/cew_visual_learning.py'
      - 'scripts/cew_visual_learning_bridge.py'
      - 'scripts/cew_visual_learning_multichannel.py'
      - 'scripts/validate_cew_visual_learning.py'
      - 'scripts/validate_cew_visual_learning_bridge.py'
      - 'scripts/validate_cew_visual_learning_multichannel.py'
      - '.github/workflows/validate-cew-visual-learning.yml'
  pull_request:
    paths:
      - 'analysis/cew/CEW_VISUAL_LEARNING_ARCHITECTURE_v1.md'
      - 'automation/CEW_VISUAL_LEARNING_CONTRACT_v1.json'
      - 'automation/CEW_VISUAL_LEARNING_IMPLEMENTATION_STATUS_v1.json'
      - 'automation/CEW_DINOV3_PROVIDER_CONTRACT_v1.json'
      - 'scripts/cew_visual_learning.py'
      - 'scripts/cew_visual_learning_bridge.py'
      - 'scripts/cew_visual_learning_multichannel.py'
      - 'scripts/validate_cew_visual_learning.py'
      - 'scripts/validate_cew_visual_learning_bridge.py'
      - 'scripts/validate_cew_visual_learning_multichannel.py'
      - '.github/workflows/validate-cew-visual-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-visual-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile learning modules
        run: >-
          python -m py_compile
          scripts/cew_visual_learning.py
          scripts/cew_visual_learning_bridge.py
          scripts/cew_visual_learning_multichannel.py
          scripts/validate_cew_visual_learning.py
          scripts/validate_cew_visual_learning_bridge.py
          scripts/validate_cew_visual_learning_multichannel.py
      - name: Validate visual learning contract and implementation status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('automation/CEW_VISUAL_LEARNING_CONTRACT_v1.json').read_text())
          assert data['schema'] == 'CEW_VISUAL_LEARNING_CONTRACT_v1'
          assert data['status'] == 'VISUAL_PROVIDER_FOUNDATION_IMPLEMENTED_NOT_PROVISIONED'
          assert data['embedding_channels']['structured_graphic']['state'] == 'IMPLEMENTED'
          visual = data['embedding_channels']['visual_foundation']
          assert visual['target_provider_id'] == 'DINOV3_FROZEN_FEATURES'
          assert visual['state'] == 'IMPLEMENTED_NOT_PROVISIONED'
          assert visual['provider_contract_ref'] == 'automation/CEW_DINOV3_PROVIDER_CONTRACT_v1.json'
          assert visual['required_for_v1'] is False
          assert visual['web_worker_dependency'] is False
          assert visual['runtime_network_fetch_allowed'] is False
          assert visual['cache_first_worker'] is True
          assert visual['actual_inference_validated'] is False
          assert data['learning_receipt']['roles'] == ['POSITIVE', 'NEGATIVE', 'AMBIGUOUS']
          assert data['prototype_memory']['negative_examples_penalize_similarity'] is True
          assert data['prototype_memory']['ambiguous_examples_excluded_from_centroids'] is True
          assert data['prototype_memory']['multiple_embedding_providers_allowed'] is True
          assert data['similarity']['multichannel_policy'] == 'NORMALIZED_WEIGHTED_MEAN_AVAILABLE_CHANNELS'
          assert data['similarity']['structured_only_fallback_allowed'] is True
          assert data['similarity']['automatic_classification'] is False
          assert data['authority']['project_semantic_authority'] == 'NONE'
          assert data['authority']['canonical_write_authorized'] is False
          assert data['authority']['structural_identity_authorized'] is False

          status = json.loads(Path('automation/CEW_VISUAL_LEARNING_IMPLEMENTATION_STATUS_v1.json').read_text())
          assert status['schema'] == 'CEW_VISUAL_LEARNING_IMPLEMENTATION_STATUS_v1'
          assert status['implementation_state'] == 'VISUAL_PROVIDER_FOUNDATION_IMPLEMENTED_NOT_PROVISIONED'
          assert status['validation_state'] in {'PENDING_EXACT_HEAD_CI', 'EXACT_HEAD_CI_VALIDATED'}
          assert status['providers']['CEW_STRUCTURED_GRAPHIC_DESCRIPTOR_V1'] == 'READY'
          assert status['providers']['DINOV3_FROZEN_FEATURES'] == 'IMPLEMENTED_NOT_PROVISIONED'
          assert status['dino_simulated'] is False
          assert status['actual_dinov3_inference_validated'] is False
          assert status['visual_foundation_embedding_operational'] is False
          assert status['learning_operational_without_visual_foundation_model'] is True
          assert status['web_runtime_ml_dependencies_added'] is False
          assert status['embedding_cache']['content_addressed'] is True
          assert status['embedding_cache']['cache_first_worker_implemented'] is True
          assert status['multichannel_fusion']['automatic_classification'] is False
          assert status['authority']['project_semantic_authority'] == 'NONE'
          assert status['authority']['canonical_write_authorized'] is False
          print('CEW_VISUAL_LEARNING_CONTRACT_AND_STATUS_PASS')
          PY
      - name: Validate active prototype learning end to end
        working-directory: scripts
        run: python validate_cew_visual_learning.py
      - name: Validate zero-prior learning bridge
        working-directory: scripts
        run: python validate_cew_visual_learning_bridge.py
      - name: Validate structured plus DINOv3 multichannel fusion
        working-directory: scripts
        run: python validate_cew_visual_learning_multichannel.py
