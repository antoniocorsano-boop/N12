name: CEW-CONTRACT-01 Closure Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CEW_OPERATIONAL_SOURCE_ROOT: /tmp/cew-contract-01-operational-source
  CEW_MODEL_OUTPUT_ROOT: /tmp/cew-contract-01-model-output

jobs:
  closure:
    name: CEW-CONTRACT-01 Closure Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize pinned operational inputs
        shell: bash
        run: |
          set -euo pipefail
          operational_commit=d806dcca72779b5a186defe557a7a9b739575a90
          git fetch --no-tags --depth=1 origin d806dcca72779b5a186defe557a7a9b739575a90
          paths=(
            data/canonical/M0G_GEOMETRY_HANDOFF_v1.json
            data/canonical/M0G_ANALYTICAL_NODES_3D_CURRENT_v1.csv
            data/canonical/M0G_RIGID_JOINT_LINKS_CURRENT_v1.csv
            data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv
            data/canonical/M1F_FOUNDATION_MODEL_CURRENT_v1.csv
            data/canonical/M1E_FOUNDATION_XY_SOLVER_PROJECTION_RULE_v1.json
            data/canonical/PT_METRIC_NETWORK_RESIDUALS_v1.csv
          )
          rm -rf "$CEW_OPERATIONAL_SOURCE_ROOT"
          for path in "${paths[@]}"; do
            mkdir -p "$CEW_OPERATIONAL_SOURCE_ROOT/$(dirname "$path")"
            git show "$operational_commit:$path" > "$CEW_OPERATIONAL_SOURCE_ROOT/$path"
          done

      - name: Materialize pinned ModelGeneration artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(python -c 'import json; print(json.load(open("evidence/cew-contract-01/model-generation/N12_CEW_MODEL_GENERATION_v1.json"))["output"]["artifact_id"])')"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          rm -rf "$CEW_MODEL_OUTPUT_ROOT"
          mkdir -p "$CEW_MODEL_OUTPUT_ROOT"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$CEW_MODEL_OUTPUT_ROOT/artifact-metadata.json"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/zip" > "$CEW_MODEL_OUTPUT_ROOT/artifact.zip"

      - name: Compile closure validator
        run: python -m py_compile scripts/validate_cew_contract_01_closure.py

      - name: Run closure unit tests
        run: python -m unittest tests/test_cew_contract_01_closure.py -v

      - name: Run review regression tests
        run: python -m unittest tests/test_cew_contract_01_review_regressions.py -v

      - name: Run final review regression tests
        run: python -m unittest tests/test_cew_contract_01_final_review_regressions.py -v

      - name: Verify repository-native gate contract
        run: python -m unittest tests/test_cew_contract_01_ci_gate.py -v

      - name: Enforce CEW-CONTRACT-01 qualification
        run: python scripts/validate_cew_contract_01_closure.py
