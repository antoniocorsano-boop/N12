name: CEW-B01 Hosted-Marker Graphical Repair

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cew-b01-hosted-marker-graphical-repair.yml'
      - 'experiments/cew_b01/hosted_marker_graphical_repair.py'
      - 'experiments/cew_b01/beam_hosted_marker_raster.py'
      - 'experiments/cew_b01/hosted_marker_occurrence_search.py'
      - 'tests/cew_b01/test_hosted_marker_bilateral_transverse.py'
      - 'tests/cew_b01/test_hosted_marker_graphical_repair.py'
      - 'governance/cew-b01/HOSTED_MARKER_GRAPHICAL_REPAIR_v1.json'
      - 'governance/cew-b01/HOSTED_MARKER_OCCURRENCE_SEARCH_v1.json'
      - 'governance/cew-b01/N12_TAV5_SOURCE_v1.json'
      - 'governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json'
      - 'requirements/cew-b01.lock.txt'
      - 'docs/superpowers/specs/2026-10-30-cew-b01-hosted-marker-graphical-repair-design.md'
      - 'docs/superpowers/plans/2026-10-30-cew-b01-hosted-marker-graphical-repair.md'
      - 'docs/experiments/2026-10-30-cew-b01-hosted-marker-graphical-repair.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-hosted-marker-graphical-repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Install frozen Tesseract system package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'

      - name: Install frozen B01 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cew-b01-hosted-marker-graphical-repair"
          source "$RUNNER_TEMP/cew-b01-hosted-marker-graphical-repair/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/cew-b01.lock.txt
          python -m pip check

      - name: Fetch frozen archival source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9

      - name: Execute exact TAV.5 graphical repair twice
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-b01-hosted-marker-graphical-repair/bin/activate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          import cv2
          import numpy as np

          from cew_b01.document_zoning import propose_document_zones
          from cew_b01.evidence_schema import Task3RasterBinding
          from cew_b01.pdf_probe import probe_pdf
          from cew_b01.primitive_census import _analysis_binary, _confirmed_analysis_mask, extract_neutral_primitives
          from cew_b01.source_contract import load_source_contract, materialize_source
          from cew_b01.zone_review_package import confirmed_zones_from_receipt, zone_set_digest
          from experiments.cew_b01.beam_hosted_markers import build_line_tracks, build_linear_carriers
          from experiments.cew_b01.hosted_marker_graphical_repair import refine_graphical_candidate
          from experiments.cew_b01.hosted_marker_occurrence_search import analyze_hosted_marker_occurrences

          SOURCE_SHA = '2143dbcfb101c7a83d0c5c7a59a11ceabdaf7d8b2568a7aeeae61fa60e66f580'
          EXPECTED_PR168_REVIEW_ELIGIBLE = 46
          ROLE_LIMITS = {
              'REVIEW_ELIGIBLE_ALONE': 8,
              'REVIEW_ELIGIBLE_BILATERAL_DOUBLE_PAIR': 8,
              'PARTIAL_TRANSVERSE_REVIEW': 6,
              'CARRIER_TOPOLOGY_REVIEW': 6,
              'MARKER_ALIGNMENT_REVIEW': 4,
          }

          def canonical_bytes(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode('utf-8')

          def safe_text(value):
              return str(value).replace('\n', ' ')

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          out = Path('evidence/cew-b01/hosted-marker-graphical-repair')
          out.mkdir(parents=True, exist_ok=True)

          contract = load_source_contract('governance/cew-b01/N12_TAV5_SOURCE_v1.json')
          materialized = materialize_source(contract, '.', runner_temp / 'tavola5-hosted-marker-graphical-repair-source.pdf')
          assert materialized.sha256 == SOURCE_SHA

          probe_dir = runner_temp / 'cew-b01-hosted-marker-graphical-repair-probe'
          probe = probe_pdf(materialized, probe_dir)
          binding = Task3RasterBinding.from_probe_mapping(probe.to_mapping())
          raster_path = probe_dir / 'tav5-page0-300dpi.png'

          proposed_zones = propose_document_zones(binding, raster_path)
          zone_receipt = json.loads(Path('governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json').read_text(encoding='utf-8'))
          zones = confirmed_zones_from_receipt(binding, proposed_zones, zone_receipt)
          assert all(zone.human_confirmed for zone in zones)
          confirmed_zone_digest = zone_set_digest(zones)
          assert confirmed_zone_digest == zone_receipt['zone_set_digest']

          primitives_a = [item.to_mapping() for item in extract_neutral_primitives(binding, raster_path, zones)]
          primitives_b = [item.to_mapping() for item in extract_neutral_primitives(binding, raster_path, zones)]
          assert canonical_bytes(primitives_a) == canonical_bytes(primitives_b)
          assert len(primitives_a) == 5633

          axis_line_count = sum(
              item.get('family') == 'LINE_SEGMENT'
              and item.get('feature_signature', {}).get('orientation') in {'HORIZONTAL', 'VERTICAL'}
              for item in primitives_a
          )
          assert axis_line_count == 733
          rectilinear_seed_count = sum(item.get('family') == 'RECTILINEAR_CLOSED_SHAPE' for item in primitives_a)
          assert rectilinear_seed_count == 124

          image = cv2.imread(str(raster_path), cv2.IMREAD_GRAYSCALE)
          assert image is not None
          mask = _confirmed_analysis_mask(binding, zones)
          _analysis, binary = _analysis_binary(image, mask)
          binary_bool = binary > 0

          occurrence_analysis_a = analyze_hosted_marker_occurrences(primitives_a, binary_bool)
          occurrence_analysis_b = analyze_hosted_marker_occurrences(primitives_a, binary_bool)
          assert canonical_bytes(occurrence_analysis_a) == canonical_bytes(occurrence_analysis_b)
          occurrences = occurrence_analysis_a['review_eligible']
          assert len(occurrences) == EXPECTED_PR168_REVIEW_ELIGIBLE
          occurrence_ids = [item['marker_primitive_id'] for item in occurrences]
          assert len(occurrence_ids) == len(set(occurrence_ids))

          tracks = build_line_tracks(primitives_a)
          carriers = build_linear_carriers(tracks)
          carrier_by_id = {item['carrier_id']: item for item in carriers}
          assert len(tracks) == 158
          assert len(carriers) == 71

          def replay():
              repaired = []
              for occurrence in occurrences:
                  carrier = carrier_by_id.get(occurrence['carrier_id'])
                  assert carrier is not None, occurrence['carrier_id']
                  repaired.append(refine_graphical_candidate(occurrence, carrier, binary_bool))
              repaired.sort(key=lambda item: (item['marker_primitive_id'], item['hosted_marker_id']))
              return repaired

          repaired_a = replay()
          repaired_b = replay()
          assert canonical_bytes(repaired_a) == canonical_bytes(repaired_b)
          repaired_ids = [item['marker_primitive_id'] for item in repaired_a]
          assert repaired_ids == sorted(occurrence_ids)
          assert len(repaired_ids) == EXPECTED_PR168_REVIEW_ELIGIBLE
          assert len(repaired_ids) == len(set(repaired_ids))

          for item in repaired_a:
              assert item['semantic_meaning'] is None
              assert item['structural_identity_authorized'] is False
              assert item['canonical_write_authorized'] is False
              assert item['g3_authorized'] is False
              assert item['merge_authorized'] is False

          role_counts = Counter(item['graphical_repair_role'] for item in repaired_a)
          topology_counts = Counter(item['carrier_topology_evidence']['topology_state'] for item in repaired_a)
          alignment_counts = Counter(item['marker_alignment_evidence']['alignment_state'] for item in repaired_a)
          section_counts = Counter(item['transverse_section_evidence']['section_state'] for item in repaired_a)

          payload = {
              'schema_id': 'CEW_B01_HOSTED_MARKER_GRAPHICAL_REPAIR',
              'schema_version': 1,
              'status': 'EXPERIMENT_ONLY_HUMAN_REVIEW_PENDING',
              'scope': 'TAV5_PR168_REVIEW_ELIGIBLE_ONLY',
              'source_sha256': materialized.sha256,
              'page_index': contract.page_index,
              'raster_width_px': binding.raster_width_px,
              'raster_height_px': binding.raster_height_px,
              'zone_set_digest': confirmed_zone_digest,
              'primitive_count': len(primitives_a),
              'axis_line_segment_count': axis_line_count,
              'rectilinear_seed_count': rectilinear_seed_count,
              'reconstructed_line_track_count': len(tracks),
              'neutral_carrier_candidate_count': len(carriers),
              'input_pr168_review_eligible_count': len(occurrences),
              'input_marker_primitive_ids': sorted(occurrence_ids),
              'repair_role_counts': dict(sorted(role_counts.items())),
              'carrier_topology_counts': dict(sorted(topology_counts.items())),
              'marker_alignment_counts': dict(sorted(alignment_counts.items())),
              'transverse_section_counts': dict(sorted(section_counts.items())),
              'repaired_occurrences': repaired_a,
              'authority': {
                  'semantic_classification_authorized': False,
                  'structural_identity_authorized': False,
                  'canonical_write_authorized': False,
                  'g2c_promotion_authorized': False,
                  'g3_authorized': False,
                  'merge_authorized': False,
              },
          }
          replay_digest = hashlib.sha256(canonical_bytes(payload)).hexdigest()
          payload['replay_sha256'] = replay_digest
          result_path = out / 'hosted-marker-graphical-repair.json'
          result_path.write_text(json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8')

          colour = cv2.cvtColor(image, cv2.COLOR_GRAY2BGR)

          def panel(item, index):
              geometry = item['marker_geometry']
              x0 = int(round(float(geometry['x'])))
              y0 = int(round(float(geometry['y'])))
              x1 = int(round(float(geometry['x']) + float(geometry['width'])))
              y1 = int(round(float(geometry['y']) + float(geometry['height'])))
              margin_x = max(260, int(round(float(geometry['width']) * 3.0)))
              margin_y = max(220, int(round(float(geometry['height']) * 4.0)))
              left = max(0, x0 - margin_x)
              top = max(0, y0 - margin_y)
              right = min(colour.shape[1], x1 + margin_x)
              bottom = min(colour.shape[0], y1 + margin_y)
              crop = colour[top:bottom, left:right].copy()

              # Frozen G1 marker = red. No snapping/refined geometry is rendered.
              cv2.rectangle(crop, (x0-left, y0-top), (x1-left, y1-top), (0,0,255), 4)

              carrier = carrier_by_id[item['carrier_id']]
              orientation = item['carrier_orientation']
              centers = sorted(float(value) for value in carrier['track_centerlines'])
              if orientation == 'HORIZONTAL':
                  for center in centers:
                      yy = int(round(center)) - top
                      if 0 <= yy < crop.shape[0]:
                          cv2.line(crop, (0, yy), (crop.shape[1]-1, yy), (0,160,0), 2)
              else:
                  for center in centers:
                      xx = int(round(center)) - left
                      if 0 <= xx < crop.shape[1]:
                          cv2.line(crop, (xx, 0), (xx, crop.shape[0]-1), (0,160,0), 2)

              transverse = item['transverse_section_evidence']
              side_colours = {'before': (180,0,180), 'after': (255,0,0)}
              for side_name in ['before', 'after']:
                  side = transverse[side_name]
                  for stroke in side.get('pair_strokes', []):
                      center = float(stroke['center'])
                      if orientation == 'HORIZONTAL':
                          xx = int(round(center)) - left
                          yy0 = max(0, int(side['cross_start']) - top)
                          yy1 = min(crop.shape[0]-1, int(side['cross_end']) - top)
                          if 0 <= xx < crop.shape[1] and yy1 >= yy0:
                              cv2.line(crop, (xx, yy0), (xx, yy1), side_colours[side_name], 3)
                      else:
                          yy = int(round(center)) - top
                          xx0 = max(0, int(side['cross_start']) - left)
                          xx1 = min(crop.shape[1]-1, int(side['cross_end']) - left)
                          if 0 <= yy < crop.shape[0] and xx1 >= xx0:
                              cv2.line(crop, (xx0, yy), (xx1, yy), side_colours[side_name], 3)

              align = item['marker_alignment_evidence']
              topology = item['carrier_topology_evidence']
              role = item['graphical_repair_role']
              title = (
                  f"G{index:02d} {role} align={align['alignment_state']} "
                  f"min={align['minimum_side_support']:.2f} topo={topology['topology_state']} "
                  f"section={transverse['section_state']} {item['marker_primitive_id']}"
              )
              header_h = 64
              crop = cv2.copyMakeBorder(crop, header_h, 0, 0, 0, cv2.BORDER_CONSTANT, value=(255,255,255))
              cv2.putText(crop, safe_text(title), (12, 38), cv2.FONT_HERSHEY_SIMPLEX, 0.48, (0,0,0), 2, cv2.LINE_AA)
              target_w = 1000
              scale = min(1.0, target_w / max(1, crop.shape[1]))
              if scale < 1.0:
                  crop = cv2.resize(crop, (max(1, int(round(crop.shape[1]*scale))), max(1, int(round(crop.shape[0]*scale)))), interpolation=cv2.INTER_AREA)
              return crop

          selected = []
          for role, limit in ROLE_LIMITS.items():
              role_items = [item for item in repaired_a if item['graphical_repair_role'] == role]
              role_items.sort(key=lambda item: item['marker_primitive_id'])
              selected.extend(role_items[:limit])

          panels = [panel(item, index + 1) for index, item in enumerate(selected)]
          if panels:
              max_w = max(p.shape[1] for p in panels)
              padded = [cv2.copyMakeBorder(p, 0, 0, 0, max_w-p.shape[1], cv2.BORDER_CONSTANT, value=(255,255,255)) if p.shape[1] < max_w else p for p in panels]
              atlas = cv2.vconcat(padded)
          else:
              atlas = np.full((220, 1200, 3), 255, dtype=np.uint8)
              cv2.putText(atlas, 'No graphical repair panels selected', (25,115), cv2.FONT_HERSHEY_SIMPLEX, 0.75, (0,0,0), 2, cv2.LINE_AA)
          atlas_path = out / 'hosted-marker-graphical-repair-atlas.png'
          assert cv2.imwrite(str(atlas_path), atlas)

          summary = {
              'source_sha256': materialized.sha256,
              'input_pr168_review_eligible_count': len(occurrences),
              'repair_role_counts': dict(sorted(role_counts.items())),
              'carrier_topology_counts': dict(sorted(topology_counts.items())),
              'marker_alignment_counts': dict(sorted(alignment_counts.items())),
              'transverse_section_counts': dict(sorted(section_counts.items())),
              'atlas_selected_count': len(selected),
              'replay_sha256': replay_digest,
              'semantic_authority': False,
              'g3_authorized': False,
              'merge_authorized': False,
          }
          print('HOSTED_MARKER_GRAPHICAL_REPAIR=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload hosted-marker graphical repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-b01-hosted-marker-graphical-repair
          path: evidence/cew-b01/hosted-marker-graphical-repair/
          if-no-files-found: error
          retention-days: 30
