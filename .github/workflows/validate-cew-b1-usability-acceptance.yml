name: Validate CEW B1 Usability Acceptance

on:
  pull_request:
    paths:
      - 'app.py'
      - 'scripts/cew_b1_acceptance_lab.py'
      - 'scripts/validate_cew_b1_usability_acceptance.py'
      - 'automation/CEW_B1_USABILITY_ACCEPTANCE_CONTRACT_v1.json'
      - 'automation/CEW_USABILITY_METRICS_MODEL_v1.json'
      - '.github/workflows/validate-cew-b1-usability-acceptance.yml'

jobs:
  validate-b1-usability-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile scripts/cew_b1_acceptance_lab.py
          python -m py_compile scripts/validate_cew_b1_usability_acceptance.py
          python -m py_compile app.py
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Validate acceptance contract and blocker semantics
        run: python scripts/validate_cew_b1_usability_acceptance.py
      - name: Route and health smoke
        env:
          CEW_AUTH_DISABLED_FOR_TEST: '1'
          CEW_AUDIT_BACKEND_MODE: 'LOCAL_TEST_ONLY'
        run: |
          python - <<'PY'
          import app
          routes={r.path for r in app.app.routes}
          assert '/acceptance/b1' in routes
          response=app.b1_acceptance_lab()
          assert response.status_code == 200
          text=response.body.decode('utf-8')
          assert 'Acceptance Lab' in text
          h=app.healthz()
          assert h['b1_acceptance_lab']=='B17_PREP_AVAILABLE_NOT_PROMOTED'
          assert h['canonical_write_authorized'] is False
          print('CEW B1.7 ACCEPTANCE LAB ROUTE: PASS')
          PY
      - name: Preserve human gate
        run: |
          echo 'Automated gate validates the measurement instrument only.'
          echo 'HVA_GATE = REQUIRED_NOT_AUTOMATED'
          echo 'PRODUCTION_SMOKE = REQUIRED_AFTER_HVA'
          echo 'SLICE_COMPLETE = false'
