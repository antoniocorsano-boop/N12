name: Validate CEW Product Transformation

on:
  pull_request:
    paths:
      - 'docs/PROGRAM/CEW_PRODUCT_COMPLETION_PROGRAM_v1.md'
      - 'docs/AUDIT/CEW_PRODUCT_AUDIT_HUMAN_CENTRIC_2026-08-27_v1.md'
      - 'docs/ARCHITECTURE/CEW_HUMAN_CENTRIC_STRUCTURAL_PRODUCT_v1.md'
      - 'docs/ROADMAP/CEW_HUMAN_CENTRIC_PRODUCT_TRANSFORMATION_v1.md'
      - 'automation/CEW_HUMAN_CENTRIC_PHASE_CONTRACT_v1.json'
      - 'automation/CEW_PROJECT_LIFECYCLE_MODEL_v1.json'
      - 'automation/CEW_PRODUCT_AGENT_CONTRACT_v1.json'
      - 'automation/CEW_PRODUCT_AGENT_RESULT_CONTRACT_v1.json'
      - 'automation/CEW_PRODUCT_TRANSFORMATION_QUEUE_v1.json'
      - 'automation/CEW_PRODUCT_STATE_RECONCILIATION_v1.json'
      - 'automation/outbox/CEW_PRODUCT_AGENT_TASK.json'
      - 'automation/inbox/CEW_PRODUCT_AGENT_RESULT.json'
      - 'automation/receipts/cew-product/**'
      - 'scripts/cew_product_orchestrator.py'
      - 'scripts/validate_cew_product_state_reconciliation.py'
      - 'scripts/validate_cew_project_lifecycle_model.py'
      - 'data/canonical/CEW_PROJECT_STATE_CURRENT_v1.json'
      - '.github/workflows/validate-cew-product-transformation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile scripts/cew_product_orchestrator.py
          if [ -f scripts/validate_cew_product_state_reconciliation.py ]; then
            python -m py_compile scripts/validate_cew_product_state_reconciliation.py
          fi
          if [ -f scripts/validate_cew_project_lifecycle_model.py ]; then
            python -m py_compile scripts/validate_cew_project_lifecycle_model.py
          fi
      - name: Validate product orchestrator
        run: python scripts/cew_product_orchestrator.py validate
      - name: Show selected work package
        run: python scripts/cew_product_orchestrator.py status
      - name: Validate state reconciliation
        run: python scripts/validate_cew_product_state_reconciliation.py
      - name: Validate P0-P16 lifecycle product spine
        run: python scripts/validate_cew_project_lifecycle_model.py
