name: Validate CEW Evidence Provenance

on:
  pull_request:
    paths:
      - 'automation/CEW_EVIDENCE_PROVENANCE_CONTRACT_v1.json'
      - 'data/canonical/CEW_PAGE_REGISTRY_v1.csv'
      - 'data/canonical/CEW_DERIVED_ASSET_REGISTRY_v1.csv'
      - 'data/canonical/CEW_COORDINATE_TRANSFORM_REGISTRY_v1.csv'
      - 'data/canonical/CEW_F2_LOCALIZATION_RECEIPT_v1.csv'
      - 'data/canonical/CEW_F2_BINDING_GUARD_v1.csv'
      - 'data/canonical/CEW_EVIDENCE_REGION_REGISTRY_v1.csv'
      - 'data/canonical/CEW_OBSERVATION_REGISTRY_v1.csv'
      - 'scripts/validate_cew_evidence_provenance.py'
      - 'scripts/validate_cew_f2_reproducible_closure.py'
      - '.github/workflows/validate-cew-evidence-provenance.yml'
  push:
    branches:
      - 'work/cew-f2-reproducible-closure'
  workflow_dispatch:

jobs:
  evidence-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.4
      - name: Fetch immutable N12 source archive commit
        run: git fetch --no-tags origin 78c20a52db4f391ce0d13b9705b9f04737e218c9
      - name: Validate system milestone state
        run: python scripts/validate_cew_system_foundation.py
      - name: Validate source identity foundation
        run: python scripts/validate_cew_source_identity.py
      - name: Validate reproducible evidence provenance closure
        run: python scripts/validate_cew_evidence_provenance.py
