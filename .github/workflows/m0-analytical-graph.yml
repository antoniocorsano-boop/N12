name: M0 Analytical Graph

on:
  push:
    branches: [feat/structural-professional-workspace-r1]
    paths:
      - 'scripts/build_m0_analytical_graph.py'
      - 'scripts/build_solver_neutral_frame_package.py'
      - 'scripts/run_roof_b_opensees_smoke.py'
      - 'scripts/run_roof_ac_section_sensitivity.py'
      - 'docs/FOGLIO_LAVORO/M0_STRUCTURAL_ENTITY_RELEASE_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_ANALYTICAL_GRAPH_MANIFEST_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_3D_PARAMETER_PACK_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_UPPER_Z_SCENARIO_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_UPPER_Z_DOCUMENT_RECONCILIATION_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_ROOF_B_SMOKE_CORE_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_ROOF_AC_SENSITIVITY_CORE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW2_G2_G3_SOURCE_BOUND_CHAIN_BRIDGE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW_G5_ANALYTICAL_COLUMN_RELEASE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW_G5_ROOF_ANALYTICAL_SKELETON_RELEASE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW_FIRST_LEVEL_TERRACE_LOCAL_SUBGRAPH_v1.csv'
      - '.github/workflows/m0-analytical-graph.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_m0_analytical_graph.py'
      - 'scripts/build_solver_neutral_frame_package.py'
      - 'scripts/run_roof_b_opensees_smoke.py'
      - 'scripts/run_roof_ac_section_sensitivity.py'
      - 'docs/FOGLIO_LAVORO/M0_STRUCTURAL_ENTITY_RELEASE_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_ANALYTICAL_GRAPH_MANIFEST_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_3D_PARAMETER_PACK_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_UPPER_Z_SCENARIO_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_UPPER_Z_DOCUMENT_RECONCILIATION_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_ROOF_B_SMOKE_CORE_v1.csv'
      - 'docs/FOGLIO_LAVORO/M0_ROOF_AC_SENSITIVITY_CORE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW2_G2_G3_SOURCE_BOUND_CHAIN_BRIDGE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW_G5_ANALYTICAL_COLUMN_RELEASE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW_G5_ROOF_ANALYTICAL_SKELETON_RELEASE_v1.csv'
      - 'docs/FOGLIO_LAVORO/ETW_FIRST_LEVEL_TERRACE_LOCAL_SUBGRAPH_v1.csv'
      - '.github/workflows/m0-analytical-graph.yml'
  workflow_dispatch:

jobs:
  build-m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenSeesPy for isolated solver smoke
        run: python -m pip install --upgrade openseespy
      - name: Validate M0 release
        run: python scripts/build_m0_analytical_graph.py --check
      - name: Build M0 analytical graph
        run: python scripts/build_m0_analytical_graph.py
      - name: Validate solver-neutral symbolic package
        run: python scripts/build_solver_neutral_frame_package.py --check
      - name: Build solver-neutral symbolic package
        run: python scripts/build_solver_neutral_frame_package.py
      - name: Confirm numeric export is explicitly blocked while ND remain
        run: |
          if python scripts/build_solver_neutral_frame_package.py --require-numeric; then
            echo 'ERROR: numeric export unexpectedly became READY'
            exit 1
          else
            echo 'NUMERIC_EXPORT_BLOCKED_EXPECTED=PASS'
          fi
      - name: Run isolated WING-B OpenSeesPy smoke
        run: python scripts/run_roof_b_opensees_smoke.py
      - name: Run WING-A/C section sensitivity
        run: python scripts/run_roof_ac_section_sensitivity.py
      - name: Show graph and solver-neutral summaries
        run: |
          python - <<'PY'
          import json
          g=json.load(open('data/generated/m0_analytical_graph_v1.json'))
          p=json.load(open('data/generated/m0_solver_neutral_frame_package_v1.json'))
          s=json.load(open('data/generated/roof_b_opensees_smoke_v1.json'))
          ac=json.load(open('data/generated/roof_ac_section_sensitivity_v1.json'))
          print('M0_GRAPH',json.dumps(g['validation'], indent=2))
          print('SOLVER_NEUTRAL',json.dumps(p['preflight'], indent=2))
          print('ROOF_B_SMOKE',json.dumps(s, indent=2))
          print('ROOF_AC_SENSITIVITY',json.dumps(ac['summary'], indent=2))
          print('nodes=',len(g['nodes']))
          print('elements=',len(g['elements']))
          print('blocked_local=',len(g['blocked_local']))
          assert p['preflight']['symbolic_status']=='PASS'
          assert p['preflight']['numeric_status']=='BLOCKED_EXPECTED'
          assert s['status']=='PASS'
          assert s['assessment_grade'] is False
          assert ac['status']=='PASS'
          assert ac['assessment_grade'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n12-m0-analytical-solver-neutral-roof-smoke-sensitivity-v1
          path: |
            data/generated/m0_analytical_graph_v1.json
            data/generated/m0_solver_neutral_frame_package_v1.json
            data/generated/roof_b_opensees_smoke_v1.json
            data/generated/roof_ac_section_sensitivity_v1.json
          retention-days: 30
