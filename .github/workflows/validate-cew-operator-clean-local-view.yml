name: Validate CEW Operator Clean Local View

on:
  push:
    branches:
      - 'work/cew-region-guided-discovery-v1'
    paths:
      - 'scripts/cew_professional_document_workbench_operator_view.py'
      - 'scripts/cew_professional_document_workbench_region_guidance_compat.py'
      - 'scripts/validate_cew_operator_view_browser.py'
      - '.github/workflows/validate-cew-operator-clean-local-view.yml'
  pull_request:
    paths:
      - 'scripts/cew_professional_document_workbench_operator_view.py'
      - 'scripts/cew_professional_document_workbench_region_guidance_compat.py'
      - 'scripts/validate_cew_operator_view_browser.py'
      - '.github/workflows/validate-cew-operator-clean-local-view.yml'

jobs:
  validate-operator-clean-local-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and browser harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compile operator clean local view
        run: |
          python -m py_compile scripts/cew_professional_document_workbench_operator_view.py scripts/validate_cew_operator_view_browser.py
      - name: Validate clean operator local review in Chromium
        working-directory: scripts
        run: python validate_cew_operator_view_browser.py
