name: Register CEW Artifact Patches

on:
  push:
    branches:
      - 'work/cew-f3-viewer-from-6067'
    paths:
      - 'scripts/register_cew_artifact_patches.py'
      - '.github/workflows/register-cew-artifact-patches.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cew-f3-viewer-from-6067
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register CEW F0-F3 patches in effective knowledge manifest
        run: python scripts/register_cew_artifact_patches.py
      - name: Commit manifest update when required
        run: |
          if git diff --quiet -- knowledge/KNOWLEDGE_MANIFEST.json; then
            echo 'KNOWLEDGE_MANIFEST already current'
            exit 0
          fi
          git config user.name 'cew-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add knowledge/KNOWLEDGE_MANIFEST.json
          git commit -m 'CEW: register F0-F3 artifact patches in knowledge manifest'
          git push origin HEAD:work/cew-f3-viewer-from-6067
