name: Register CEW Artifact Patches

on:
  push:
    branches:
      - 'work/cew-f3-viewer-from-6067'
      - 'work/cew-f4-ai-observation-from-57e30'
    paths:
      - 'scripts/register_cew_artifact_patches.py'
      - 'knowledge/ARTIFACT_REGISTRY_CEW_AI_OBSERVATION_PATCH_v1.csv'
      - '.github/workflows/register-cew-artifact-patches.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register effective CEW artifact patches
        run: python scripts/register_cew_artifact_patches.py
      - name: Commit manifest update when required
        run: |
          if git diff --quiet -- knowledge/KNOWLEDGE_MANIFEST.json; then
            echo 'KNOWLEDGE_MANIFEST already current'
            exit 0
          fi
          git config user.name 'cew-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add knowledge/KNOWLEDGE_MANIFEST.json
          git commit -m 'CEW: register effective artifact patches in knowledge manifest'
          git push origin HEAD:${{ github.ref_name }}
