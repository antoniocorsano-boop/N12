name: CEW-B01 Hosted-Marker Occurrence Search

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cew-b01-hosted-marker-occurrence-search.yml'
      - 'experiments/cew_b01/hosted_marker_occurrence_search.py'
      - 'experiments/cew_b01/beam_hosted_markers.py'
      - 'experiments/cew_b01/beam_hosted_marker_raster.py'
      - 'experiments/cew_b01/beam_hosted_marker_hybrid.py'
      - 'tests/cew_b01/test_hosted_marker_occurrence_search.py'
      - 'governance/cew-b01/N12_TAV5_SOURCE_v1.json'
      - 'governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json'
      - 'requirements/cew-b01.lock.txt'
      - 'docs/superpowers/specs/2026-10-30-cew-b01-hosted-marker-occurrence-search-design.md'
      - 'docs/superpowers/plans/2026-10-30-cew-b01-hosted-marker-occurrence-search.md'
      - 'governance/cew-b01/HOSTED_MARKER_OCCURRENCE_SEARCH_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-hosted-marker-occurrence-search:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Install frozen Tesseract system package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'

      - name: Install frozen B01 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cew-b01-hosted-marker-search"
          source "$RUNNER_TEMP/cew-b01-hosted-marker-search/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/cew-b01.lock.txt
          python -m pip check

      - name: Fetch frozen archival source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9

      - name: Execute exact TAV.5 occurrence search twice
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-b01-hosted-marker-search/bin/activate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          import cv2
          import numpy as np

          from cew_b01.document_zoning import propose_document_zones
          from cew_b01.evidence_schema import Task3RasterBinding
          from cew_b01.pdf_probe import probe_pdf
          from cew_b01.primitive_census import (
              _analysis_binary,
              _confirmed_analysis_mask,
              extract_neutral_primitives,
          )
          from cew_b01.source_contract import load_source_contract, materialize_source
          from cew_b01.zone_review_package import confirmed_zones_from_receipt, zone_set_digest
          from experiments.cew_b01.beam_hosted_markers import build_line_tracks, build_linear_carriers
          from experiments.cew_b01.hosted_marker_occurrence_search import (
              analyze_hosted_marker_occurrences,
              pair_evidence_overlay_spec,
              rank_occurrences_for_review,
          )

          SOURCE_SHA = '2143dbcfb101c7a83d0c5c7a59a11ceabdaf7d8b2568a7aeeae61fa60e66f580'
          C5 = 'CEW-B01-GP-90cefb124e0b97a63acd1d9c'
          C7 = 'CEW-B01-GP-f5bf9ee85705380152aae053'
          A10_REJECT = 'CEW-B01-GP-cf4860204d8bb1c826d35f40'
          A17_REJECT = 'CEW-B01-GP-8b7eae9c9f25bb1d73c6f504'
          ALONE = 'RECT_ALONE_ON_CARRIER'
          PAIR = 'RECT_PLUS_TRANSVERSE_PAIR_CANDIDATE'
          REVIEW_LIMIT_PER_STATE = 12
          REJECT_ATLAS_LIMIT = 12

          def canonical_bytes(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode('utf-8')

          def safe_text(value):
              return str(value).replace('\n', ' ')

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          out = Path('evidence/cew-b01/hosted-marker-occurrence-search')
          out.mkdir(parents=True, exist_ok=True)

          contract = load_source_contract('governance/cew-b01/N12_TAV5_SOURCE_v1.json')
          materialized = materialize_source(contract, '.', runner_temp / 'tavola5-hosted-marker-search-source.pdf')
          assert materialized.sha256 == SOURCE_SHA

          probe_dir = runner_temp / 'cew-b01-hosted-marker-search-probe'
          probe = probe_pdf(materialized, probe_dir)
          binding = Task3RasterBinding.from_probe_mapping(probe.to_mapping())
          raster_path = probe_dir / 'tav5-page0-300dpi.png'

          proposed_zones = propose_document_zones(binding, raster_path)
          zone_receipt = json.loads(Path('governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json').read_text(encoding='utf-8'))
          zones = confirmed_zones_from_receipt(binding, proposed_zones, zone_receipt)
          assert all(zone.human_confirmed for zone in zones)
          confirmed_zone_digest = zone_set_digest(zones)
          assert confirmed_zone_digest == zone_receipt['zone_set_digest']

          primitives_a = extract_neutral_primitives(binding, raster_path, zones)
          primitives_b = extract_neutral_primitives(binding, raster_path, zones)
          mappings_a = [item.to_mapping() for item in primitives_a]
          mappings_b = [item.to_mapping() for item in primitives_b]
          assert canonical_bytes(mappings_a) == canonical_bytes(mappings_b)
          assert len(mappings_a) == 5633

          axis_line_count = sum(
              item.get('family') == 'LINE_SEGMENT'
              and item.get('feature_signature', {}).get('orientation') in {'HORIZONTAL', 'VERTICAL'}
              for item in mappings_a
          )
          assert axis_line_count == 733

          rectilinear_seed_count = sum(
              item.get('family') == 'RECTILINEAR_CLOSED_SHAPE'
              for item in mappings_a
          )

          image = cv2.imread(str(raster_path), cv2.IMREAD_GRAYSCALE)
          assert image is not None
          mask = _confirmed_analysis_mask(binding, zones)
          _analysis, binary = _analysis_binary(image, mask)
          binary_bool = binary > 0

          analysis_a = analyze_hosted_marker_occurrences(mappings_a, binary_bool)
          analysis_b = analyze_hosted_marker_occurrences(mappings_a, binary_bool)
          assert canonical_bytes(analysis_a) == canonical_bytes(analysis_b)

          occurrences_a = analysis_a['review_eligible']
          occurrences_b = analysis_b['review_eligible']
          rejected_a = analysis_a['annotation_dominated']
          all_bound_a = analysis_a['all_bound']

          by_id = {item['marker_primitive_id']: item for item in occurrences_a}
          rejected_by_id = {item['marker_primitive_id']: item for item in rejected_a}
          assert C5 in by_id, 'C5 missing from review-eligible hosted-marker discovery'
          assert C7 in by_id, 'C7 missing from review-eligible hosted-marker discovery'
          assert A10_REJECT not in by_id, 'A10 annotation box remained review-eligible'
          assert A17_REJECT not in by_id, 'A17 annotation box remained review-eligible'
          assert A10_REJECT in rejected_by_id, 'A10 missing from annotation-dominated evidence'
          assert A17_REJECT in rejected_by_id, 'A17 missing from annotation-dominated evidence'
          assert rejected_by_id[A10_REJECT]['annotation_evidence']['annotation_dominated'] is True
          assert rejected_by_id[A17_REJECT]['annotation_evidence']['annotation_dominated'] is True
          assert by_id[C5]['candidate_role'] == 'REVIEW_ELIGIBLE'
          assert by_id[C7]['candidate_role'] == 'REVIEW_ELIGIBLE'
          assert by_id[C5]['graphical_state'] == ALONE, by_id[C5]
          assert by_id[C7]['graphical_state'] == PAIR, by_id[C7]
          assert by_id[C7]['raster_transverse_evidence']['pair_detected'] is True
          assert 'RASTER_LOCAL_PROFILE' in by_id[C7]['pair_evidence_sources']

          for item in all_bound_a:
              assert item['semantic_meaning'] is None
              assert item['structural_identity_authorized'] is False
              assert item['canonical_write_authorized'] is False
              assert item['g3_authorized'] is False
              assert item['merge_authorized'] is False

          prototypes = {ALONE: by_id[C5], PAIR: by_id[C7]}
          ranked_a = rank_occurrences_for_review(occurrences_a, prototypes)
          ranked_b = rank_occurrences_for_review(occurrences_b, prototypes)
          assert canonical_bytes(ranked_a) == canonical_bytes(ranked_b)

          counts = Counter(item['graphical_state'] for item in occurrences_a)
          ranked_counts = Counter(item['graphical_state'] for item in ranked_a)
          rejected_signal_counts = Counter(
              signal
              for item in rejected_a
              for signal in item.get('annotation_evidence', {}).get('signals', [])
          )

          tracks = build_line_tracks(mappings_a)
          carriers = build_linear_carriers(tracks)
          carrier_by_id = {item['carrier_id']: item for item in carriers}

          selected = []
          for state in [ALONE, PAIR]:
              state_items = [item for item in ranked_a if item['graphical_state'] == state]
              selected.extend(state_items[:REVIEW_LIMIT_PER_STATE])

          reject_priority = {A10_REJECT: 0, A17_REJECT: 1}
          selected_rejected = sorted(
              rejected_a,
              key=lambda item: (
                  reject_priority.get(item['marker_primitive_id'], 2),
                  item['marker_primitive_id'],
              ),
          )[:REJECT_ATLAS_LIMIT]

          occurrence_payload = {
              'schema_id': 'CEW_B01_HOSTED_MARKER_OCCURRENCE_SEARCH',
              'schema_version': 2,
              'status': 'EXPERIMENT_ONLY_REWORKED',
              'scope': 'TAV5_ONLY',
              'source_sha256': materialized.sha256,
              'page_index': contract.page_index,
              'raster_width_px': binding.raster_width_px,
              'raster_height_px': binding.raster_height_px,
              'raster_sha256': binding.raster_sha256,
              'zone_set_digest': confirmed_zone_digest,
              'primitive_count': len(mappings_a),
              'axis_line_segment_count': axis_line_count,
              'rectilinear_seed_count': rectilinear_seed_count,
              'reconstructed_line_track_count': len(tracks),
              'neutral_carrier_candidate_count': len(carriers),
              'frozen_prototypes': {
                  ALONE: C5,
                  PAIR: C7,
              },
              'all_bound_occurrence_count': len(all_bound_a),
              'review_eligible_occurrence_count': len(occurrences_a),
              'annotation_dominated_count': len(rejected_a),
              'annotation_dominated_signal_counts': dict(sorted(rejected_signal_counts.items())),
              'counts_by_graphical_state': dict(sorted(counts.items())),
              'additional_ranked_count': len(ranked_a),
              'additional_ranked_counts_by_graphical_state': dict(sorted(ranked_counts.items())),
              'atlas_limit_per_state': REVIEW_LIMIT_PER_STATE,
              'atlas_selected_marker_ids': [item['marker_primitive_id'] for item in selected],
              'annotation_atlas_selected_marker_ids': [item['marker_primitive_id'] for item in selected_rejected],
              'review_eligible_occurrences': occurrences_a,
              'annotation_dominated_occurrences': rejected_a,
              'all_bound_occurrences': all_bound_a,
              'ranked_additional_occurrences': ranked_a,
              'authority': {
                  'semantic_classification_authorized': False,
                  'structural_identity_authorized': False,
                  'canonical_write_authorized': False,
                  'g2c_promotion_authorized': False,
                  'g3_authorized': False,
                  'merge_authorized': False,
              },
          }
          replay_digest = hashlib.sha256(canonical_bytes(occurrence_payload)).hexdigest()
          occurrence_payload['replay_sha256'] = replay_digest
          result_path = out / 'hosted-marker-occurrences.json'
          result_path.write_text(
              json.dumps(occurrence_payload, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          colour = cv2.cvtColor(image, cv2.COLOR_GRAY2BGR)

          def candidate_panel(candidate, index, prefix='A'):
              geometry = candidate['marker_geometry']
              x0 = int(round(float(geometry['x'])))
              y0 = int(round(float(geometry['y'])))
              x1 = int(round(float(geometry['x']) + float(geometry['width'])))
              y1 = int(round(float(geometry['y']) + float(geometry['height'])))

              orientation = candidate['carrier_orientation']
              long_span = float(geometry['width']) if orientation == 'HORIZONTAL' else float(geometry['height'])
              cross_span = float(geometry['height']) if orientation == 'HORIZONTAL' else float(geometry['width'])
              margin_x = max(220, int(round(max(float(geometry['width']) * 2.5, long_span * 1.5))))
              margin_y = max(180, int(round(max(float(geometry['height']) * 3.0, cross_span * 3.0))))
              left = max(0, x0 - margin_x)
              top = max(0, y0 - margin_y)
              right = min(colour.shape[1], x1 + margin_x)
              bottom = min(colour.shape[0], y1 + margin_y)
              crop = colour[top:bottom, left:right].copy()

              cv2.rectangle(crop, (x0-left, y0-top), (x1-left, y1-top), (0,0,255), 4)

              carrier = carrier_by_id.get(candidate['carrier_id'])
              if carrier is not None:
                  centers = sorted(float(v) for v in carrier['track_centerlines'])
                  if orientation == 'HORIZONTAL':
                      for center in centers:
                          yy = int(round(center)) - top
                          if 0 <= yy < crop.shape[0]:
                              cv2.line(crop, (0, yy), (crop.shape[1]-1, yy), (0,160,0), 2)
                  else:
                      for center in centers:
                          xx = int(round(center)) - left
                          if 0 <= xx < crop.shape[1]:
                              cv2.line(crop, (xx, 0), (xx, crop.shape[0]-1), (0,160,0), 2)

              for overlay in pair_evidence_overlay_spec(candidate, tracks):
                  source = overlay['source']
                  # Primitive/G1 pair: magenta. Raster-recovered pair: blue.
                  draw_colour = (180,0,180) if source == 'PRIMITIVE_LOCAL_TRACK_PAIR' else (255,0,0)
                  thickness = 2 if source == 'PRIMITIVE_LOCAL_TRACK_PAIR' else 3
                  if overlay['orientation'] == 'VERTICAL':
                      xx = int(round(float(overlay['centerline']))) - left
                      yy0 = max(0, int(round(float(overlay['start']))) - top)
                      yy1 = min(crop.shape[0]-1, int(round(float(overlay['end']))) - top)
                      if 0 <= xx < crop.shape[1] and yy1 >= yy0:
                          cv2.line(crop, (xx, yy0), (xx, yy1), draw_colour, thickness)
                  else:
                      yy = int(round(float(overlay['centerline']))) - top
                      xx0 = max(0, int(round(float(overlay['start']))) - left)
                      xx1 = min(crop.shape[1]-1, int(round(float(overlay['end']))) - left)
                      if 0 <= yy < crop.shape[0] and xx1 >= xx0:
                          cv2.line(crop, (xx0, yy), (xx1, yy), draw_colour, thickness)

              source_labels = []
              if 'PRIMITIVE_LOCAL_TRACK_PAIR' in candidate.get('pair_evidence_sources', []):
                  source_labels.append('G1')
              if 'RASTER_LOCAL_PROFILE' in candidate.get('pair_evidence_sources', []):
                  source_labels.append('RASTER')
              source_text = '+'.join(source_labels) if source_labels else '-'
              distance = candidate.get('prototype_distance')
              distance_text = f" d={float(distance):.3f}" if distance is not None else ''
              title = (
                  f"{prefix}{index:02d} {candidate['candidate_role']} {candidate['graphical_state']}"
                  f" src={source_text}{distance_text} {candidate['marker_primitive_id']}"
              )
              header_h = 54
              crop = cv2.copyMakeBorder(crop, header_h, 0, 0, 0, cv2.BORDER_CONSTANT, value=(255,255,255))
              cv2.putText(crop, safe_text(title), (12, 34), cv2.FONT_HERSHEY_SIMPLEX, 0.54, (0,0,0), 2, cv2.LINE_AA)

              target_w = 900
              scale = min(1.0, target_w / max(1, crop.shape[1]))
              if scale < 1.0:
                  crop = cv2.resize(
                      crop,
                      (max(1, int(round(crop.shape[1] * scale))), max(1, int(round(crop.shape[0] * scale)))),
                      interpolation=cv2.INTER_AREA,
                  )
              return crop

          def vertical_atlas(candidates, prefix, empty_message):
              panels = [candidate_panel(candidate, index + 1, prefix) for index, candidate in enumerate(candidates)]
              if not panels:
                  atlas = np.full((220, 1200, 3), 255, dtype=np.uint8)
                  cv2.putText(atlas, empty_message, (25, 115), cv2.FONT_HERSHEY_SIMPLEX, 0.75, (0,0,0), 2, cv2.LINE_AA)
                  return atlas
              max_w = max(panel.shape[1] for panel in panels)
              padded = []
              for panel in panels:
                  if panel.shape[1] < max_w:
                      panel = cv2.copyMakeBorder(
                          panel, 0, 0, 0, max_w - panel.shape[1],
                          cv2.BORDER_CONSTANT, value=(255,255,255),
                      )
                  padded.append(panel)
              return cv2.vconcat(padded)

          atlas = vertical_atlas(
              selected,
              'A',
              'No additional review-eligible hosted-marker occurrences found under frozen rules',
          )
          atlas_path = out / 'hosted-marker-occurrence-atlas.png'
          assert cv2.imwrite(str(atlas_path), atlas)

          rejected_atlas = vertical_atlas(
              selected_rejected,
              'R',
              'No annotation-dominated hosted-marker occurrences detected',
          )
          rejected_atlas_path = out / 'hosted-marker-annotation-dominated-atlas.png'
          assert cv2.imwrite(str(rejected_atlas_path), rejected_atlas)

          summary = {
              'source_sha256': materialized.sha256,
              'primitive_count': len(mappings_a),
              'rectilinear_seed_count': rectilinear_seed_count,
              'all_bound_occurrence_count': len(all_bound_a),
              'review_eligible_occurrence_count': len(occurrences_a),
              'annotation_dominated_count': len(rejected_a),
              'annotation_dominated_signal_counts': dict(sorted(rejected_signal_counts.items())),
              'counts_by_graphical_state': dict(sorted(counts.items())),
              'additional_ranked_count': len(ranked_a),
              'additional_ranked_counts_by_graphical_state': dict(sorted(ranked_counts.items())),
              'atlas_selected_count': len(selected),
              'annotation_atlas_selected_count': len(selected_rejected),
              'replay_sha256': replay_digest,
              'semantic_authority': False,
              'g3_authorized': False,
              'merge_authorized': False,
          }
          print('HOSTED_MARKER_OCCURRENCE_SEARCH=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload hosted-marker occurrence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-b01-hosted-marker-occurrence-search
          path: evidence/cew-b01/hosted-marker-occurrence-search/
          if-no-files-found: error
          retention-days: 30
