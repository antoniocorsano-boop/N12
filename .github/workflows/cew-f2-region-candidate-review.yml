name: CEW F2 Region Candidate Review

on:
  pull_request:
    paths:
      - 'data/review/CEW_F2_REFERENCE_REGION_CANDIDATES_v1.csv'
      - 'scripts/cew_render_region_candidates.py'
      - '.github/workflows/cew-f2-region-candidate-review.yml'
      - 'data/canonical/CEW_EVIDENCE_REGION_REGISTRY_v1.csv'
  workflow_dispatch:

jobs:
  render-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch immutable primary PDFs
        run: |
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9
          mkdir -p /tmp/cew-primary
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:"archive/documentazione_originaria/tavola 5-3.pdf" > /tmp/cew-primary/tavola5-3.pdf
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:"archive/documentazione_originaria/tavola 6.pdf" > /tmp/cew-primary/tavola6.pdf
          echo '17dec414f0f0505e2cd2acb519029afba7672df1793a580badb8b59b6214f325  /tmp/cew-primary/tavola5-3.pdf' | sha256sum -c -
          echo '3f2d557fe6d3c65eb0891b1fd4f0f6f2a0a4b6cd0efe22a06604a5c341fc9c6d  /tmp/cew-primary/tavola6.pdf' | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PDF dependency
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Render candidate regions at 300 dpi
        run: |
          python scripts/cew_render_region_candidates.py \
            --candidates data/review/CEW_F2_REFERENCE_REGION_CANDIDATES_v1.csv \
            --tav05a /tmp/cew-primary/tavola5-3.pdf \
            --tav06a /tmp/cew-primary/tavola6.pdf \
            --dpi 300 \
            --out-dir cew-f2-region-candidates

      - name: Upload candidate review pack
        uses: actions/upload-artifact@v4
        with:
          name: cew-f2-region-candidates-300dpi
          path: cew-f2-region-candidates/
          if-no-files-found: error
          retention-days: 14
