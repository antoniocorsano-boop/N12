name: Refresh CEW Project Context

on:
  push:
    paths:
      - 'knowledge/CURRENT_STATE.json'
      - 'knowledge/KNOWLEDGE_MANIFEST.json'
      - 'knowledge/ARTIFACT_REGISTRY.csv'
      - 'knowledge/ARTIFACT_REGISTRY_*_PATCH_v*.csv'
      - 'data/canonical/CEW_PROJECT_STATE_CURRENT_v1.json'
      - 'docs/REFERENCE/**'
      - 'scripts/build_project_context.py'
      - 'scripts/agent_bootstrap.py'
      - '.github/workflows/refresh-cew-context.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run context fast-path tests
        run: python -m unittest tests/test_build_project_context.py tests/test_agent_bootstrap.py
      - name: Refresh compact context
        run: python scripts/build_project_context.py --write
      - name: Verify compact context freshness
        run: python scripts/build_project_context.py --check
      - name: Commit generated context when changed
        run: |
          if git diff --quiet -- knowledge/CONTEXT_PACK_CURRENT.json; then
            echo 'CONTEXT_PACK already current'
            exit 0
          fi
          git config user.name 'cew-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add knowledge/CONTEXT_PACK_CURRENT.json
          git commit -m 'CEW: refresh compact project context'
          git push origin HEAD:${{ github.ref_name }}
