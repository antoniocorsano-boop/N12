name: ETW2 Raster Registration G3 G4

on:
  workflow_dispatch:
  push:
    branches:
      - feat/structural-professional-workspace-r1
    paths:
      - 'model/etwin/floor_image_registration.py'
      - 'model/etwin/document_registry.py'
      - 'archive/documentazione_originaria/tavola4-2.pdf'
      - 'archive/documentazione_originaria/tavola 5.pdf'
      - '.github/workflows/etw2-raster-registration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/etwin/floor_image_registration.py'
      - 'model/etwin/document_registry.py'
      - 'archive/documentazione_originaria/tavola4-2.pdf'
      - 'archive/documentazione_originaria/tavola 5.pdf'
      - '.github/workflows/etw2-raster-registration.yml'

jobs:
  raster-register-g3-g4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pypdfium2 Pillow opencv-python-headless numpy

      - name: Register G3 to G4
        run: python -m model.etwin.floor_image_registration

      - name: Validate registration outputs
        shell: bash
        run: |
          set -euo pipefail
          root='docs/FOGLIO_LAVORO/etwin_crops/ETW-2/G4_G3_registered'
          test -f "$root/registration_result.json"
          test -f "$root/OVERVIEW_G4_TARGET.png"
          test -f "$root/OVERVIEW_G3_REGISTERED_TO_G4.png"
          test -f "$root/OVERVIEW_ABSDIFF.png"
          test -f "$root/OVERVIEW_DIFF_THRESHOLD.png"

      - name: Upload registered comparison
        uses: actions/upload-artifact@v4
        with:
          name: etw2-g3-g4-registered
          path: docs/FOGLIO_LAVORO/etwin_crops/ETW-2/G4_G3_registered/
          retention-days: 14
