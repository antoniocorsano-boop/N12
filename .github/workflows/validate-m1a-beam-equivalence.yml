name: Validate M1-A beam equivalence

on:
  push:
    branches:
      - work/m0-global-model
    paths:
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_SOURCE_COVERAGE_CURRENT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_INFERRED_BINDINGS_CURRENT_v1.csv'
      - 'data/canonical/M1A_50X20_REINFORCEMENT_PRECEDENT_AUDIT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_EQUIVALENCE_GATE_v1.csv'
      - 'data/canonical/M1A_TAV034A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV05A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv'
      - 'knowledge/ARTIFACT_REGISTRY_M1A_BEAM_EQUIVALENCE_PATCH_v1.csv'
      - 'scripts/validate_m1a_beam_equivalence.py'
      - '.github/workflows/validate-m1a-beam-equivalence.yml'
  pull_request:
    paths:
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_SOURCE_COVERAGE_CURRENT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_INFERRED_BINDINGS_CURRENT_v1.csv'
      - 'data/canonical/M1A_50X20_REINFORCEMENT_PRECEDENT_AUDIT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_EQUIVALENCE_GATE_v1.csv'
      - 'data/canonical/M1A_TAV034A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV05A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv'
      - 'knowledge/ARTIFACT_REGISTRY_M1A_BEAM_EQUIVALENCE_PATCH_v1.csv'
      - 'scripts/validate_m1a_beam_equivalence.py'
      - '.github/workflows/validate-m1a-beam-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate authored beam equivalence and 50x20 evidence boundary
        run: python scripts/validate_m1a_beam_equivalence.py
