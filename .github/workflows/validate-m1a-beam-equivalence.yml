name: Validate M1-A beam equivalence

on:
  push:
    branches:
      - work/m0-global-model
    paths:
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_SOURCE_COVERAGE_CURRENT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_INFERRED_BINDINGS_CURRENT_v1.csv'
      - 'data/canonical/M1A_50X20_REINFORCEMENT_PRECEDENT_AUDIT_v1.csv'
      - 'data/canonical/M1A_50X20_REINFORCEMENT_TRANSFER_GATE_v1.csv'
      - 'data/canonical/M1A_25X70_CROSSLINK_4_5_AUDIT_v1.csv'
      - 'data/canonical/M1A_25X70_CROSSLINK_4_5_GATE_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_DRAFTING_LOGIC_CURRENT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_EQUIVALENCE_GATE_v1.csv'
      - 'data/canonical/M1A_TAV02A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV034A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV05A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv'
      - 'data/canonical/M1_PROGRAM_REQUIRED_FRONTS_CURRENT_v1.csv'
      - 'knowledge/ARTIFACT_REGISTRY_M1A_SPECIAL_PATCH_v1.csv'
      - 'knowledge/KNOWLEDGE_MANIFEST.json'
      - 'scripts/validate_m1a_beam_equivalence.py'
      - 'scripts/validate_m1a_50x20_reinforcement.py'
      - 'scripts/validate_m1a_25x70_crosslink_4_5.py'
      - '.github/workflows/validate-m1a-beam-equivalence.yml'
  pull_request:
    paths:
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_SOURCE_COVERAGE_CURRENT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_INFERRED_BINDINGS_CURRENT_v1.csv'
      - 'data/canonical/M1A_50X20_REINFORCEMENT_PRECEDENT_AUDIT_v1.csv'
      - 'data/canonical/M1A_50X20_REINFORCEMENT_TRANSFER_GATE_v1.csv'
      - 'data/canonical/M1A_25X70_CROSSLINK_4_5_AUDIT_v1.csv'
      - 'data/canonical/M1A_25X70_CROSSLINK_4_5_GATE_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_DRAFTING_LOGIC_CURRENT_v1.csv'
      - 'data/canonical/M1A_BEAM_REINFORCEMENT_EQUIVALENCE_GATE_v1.csv'
      - 'data/canonical/M1A_TAV02A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV034A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV05A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M0G_MEMBER_CONNECTIVITY_CURRENT_v1.csv'
      - 'data/canonical/M1_PROGRAM_REQUIRED_FRONTS_CURRENT_v1.csv'
      - 'knowledge/ARTIFACT_REGISTRY_M1A_SPECIAL_PATCH_v1.csv'
      - 'knowledge/KNOWLEDGE_MANIFEST.json'
      - 'scripts/validate_m1a_beam_equivalence.py'
      - 'scripts/validate_m1a_50x20_reinforcement.py'
      - 'scripts/validate_m1a_25x70_crosslink_4_5.py'
      - '.github/workflows/validate-m1a-beam-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate authored beam equivalence and 50x20 evidence boundary
        run: python scripts/validate_m1a_beam_equivalence.py

      - name: Validate 50x20 current-evidence transfer closure
        run: python scripts/validate_m1a_50x20_reinforcement.py

      - name: Validate recurring 25x70 cross-link 4-5 boundary
        run: python scripts/validate_m1a_25x70_crosslink_4_5.py
