name: Validate M1-A special reinforcement

on:
  push:
    branches:
      - work/m0-global-model
    paths:
      - 'data/canonical/M1A_G5_EAVE_CANTILEVER_ENDS_CURRENT_v1.csv'
      - 'data/canonical/M1A_G5_EAVE_REINFORCEMENT_GATE_v1.csv'
      - 'data/canonical/M1A_G5_RIDGE_GRONDA_INTERPRETATION_CURRENT_v1.csv'
      - 'data/canonical/M1A_G5_GRONDA_CORNICE_BINDING_GATE_v1.csv'
      - 'data/canonical/M1A_G5_COLUMN_REINFORCEMENT_BINDING_CURRENT_v1.csv'
      - 'data/canonical/M1A_G5_COLUMN_REINFORCEMENT_SOURCE_CONFLICT_v1.csv'
      - 'data/canonical/M1A_G5_COLUMN_REINFORCEMENT_GATE_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_FAMILIES_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_BINDING_CURRENT_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_COVERAGE_CURRENT_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_CARPENTRY_FIRST_CONFLICTS_v1.csv'
