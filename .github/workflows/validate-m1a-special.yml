      - 'data/canonical/PT_PILLAR_SECTIONS_HIRES_CURRENT_v2.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G2_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G3_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G4_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G5_v1.csv'
      - 'data/canonical/M1A_BALCONY_CORNICE_REINFORCEMENT_SOURCE_AUDIT_v1.csv'
      - 'data/canonical/M1A_TAV05A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV05A_GROUP_REINFORCEMENT_v1.csv'
      - 'data/canonical/M1A_TAV05A_GROUP_TRANSCRIPTION_GATE_v1.csv'
      - 'data/canonical/M1A_STAIR_TOWER_SUBSYSTEM_CURRENT_v1.csv'
      - 'data/canonical/M1A_STAIR_TOWER_BINDING_GATE_v1.csv'
      - 'data/canonical/M1A_SPECIAL_FEATURE_REINFORCEMENT_GAP_REGISTER_v1.csv'
      - 'data/canonical/M1A_G1_TERRACE_ADDITION_GATE_v1.csv'
      - 'data/canonical/PT_TERRACE_GEOMETRY_CURRENT_v1.csv'
      - 'data/canonical/PT_MASTER_CURRENT.csv'
      - 'data/canonical/M1F_AD_HISTORICAL_MODEL_DELTA_AUDIT_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_CONTINUITY_G4_G5_TAV06S_v1.json'
      - 'scripts/validate_m1a_g5_eave_reinforcement.py'
      - 'scripts/validate_m1a_tav05a_group_transcription.py'
      - 'scripts/validate_m1a_stair_gronda_binding.py'
      - 'scripts/validate_m1a_g1_terrace_addition.py'
      - 'scripts/validate_m1a_g5_column_reinforcement.py'
      - 'scripts/validate_m1a_column_carpentry_first_binding.py'
      - '.github/workflows/validate-m1a-special.yml'
  pull_request:
    paths:
      - 'data/canonical/M1A_G5_EAVE_CANTILEVER_ENDS_CURRENT_v1.csv'
      - 'data/canonical/M1A_G5_EAVE_REINFORCEMENT_GATE_v1.csv'
      - 'data/canonical/M1A_G5_RIDGE_GRONDA_INTERPRETATION_CURRENT_v1.csv'
      - 'data/canonical/M1A_G5_GRONDA_CORNICE_BINDING_GATE_v1.csv'
      - 'data/canonical/M1A_G5_COLUMN_REINFORCEMENT_BINDING_CURRENT_v1.csv'
      - 'data/canonical/M1A_G5_COLUMN_REINFORCEMENT_SOURCE_CONFLICT_v1.csv'
      - 'data/canonical/M1A_G5_COLUMN_REINFORCEMENT_GATE_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_FAMILIES_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_BINDING_CURRENT_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_COVERAGE_CURRENT_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_CARPENTRY_FIRST_CONFLICTS_v1.csv'
      - 'data/canonical/M1A_COLUMN_REINFORCEMENT_BINDING_GATE_v1.csv'
      - 'data/canonical/PT_PILLAR_SECTIONS_HIRES_CURRENT_v2.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G2_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G3_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G4_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_SECTIONS_G5_v1.csv'
      - 'data/canonical/M1A_BALCONY_CORNICE_REINFORCEMENT_SOURCE_AUDIT_v1.csv'
      - 'data/canonical/M1A_TAV05A_BEAM_GROUP_INDEX_v1.csv'
      - 'data/canonical/M1A_TAV05A_GROUP_REINFORCEMENT_v1.csv'
      - 'data/canonical/M1A_TAV05A_GROUP_TRANSCRIPTION_GATE_v1.csv'
      - 'data/canonical/M1A_STAIR_TOWER_SUBSYSTEM_CURRENT_v1.csv'
      - 'data/canonical/M1A_STAIR_TOWER_BINDING_GATE_v1.csv'
      - 'data/canonical/M1A_SPECIAL_FEATURE_REINFORCEMENT_GAP_REGISTER_v1.csv'
      - 'data/canonical/M1A_G1_TERRACE_ADDITION_GATE_v1.csv'
      - 'data/canonical/PT_TERRACE_GEOMETRY_CURRENT_v1.csv'
      - 'data/canonical/PT_MASTER_CURRENT.csv'
      - 'data/canonical/M1F_AD_HISTORICAL_MODEL_DELTA_AUDIT_v1.csv'
      - 'data/canonical/STOREY_SUPPORT_CONTINUITY_G4_G5_TAV06S_v1.json'
      - 'scripts/validate_m1a_g5_eave_reinforcement.py'
      - 'scripts/validate_m1a_tav05a_group_transcription.py'
      - 'scripts/validate_m1a_stair_gronda_binding.py'
      - 'scripts/validate_m1a_g1_terrace_addition.py'
      - 'scripts/validate_m1a_g5_column_reinforcement.py'
      - 'scripts/validate_m1a_column_carpentry_first_binding.py'
      - '.github/workflows/validate-m1a-special.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate G5 eave reinforcement host binding
        run: python scripts/validate_m1a_g5_eave_reinforcement.py

      - name: Validate TAV-05A group transcription
        run: python scripts/validate_m1a_tav05a_group_transcription.py

      - name: Validate stair tower and gronda bindings
        run: python scripts/validate_m1a_stair_gronda_binding.py

      - name: Validate G1 terrace addition evidence boundary
        run: python scripts/validate_m1a_g1_terrace_addition.py

      - name: Validate G5 column reinforcement binding
        run: python scripts/validate_m1a_g5_column_reinforcement.py

      - name: Validate carpenteria-first column reinforcement binding
        run: python scripts/validate_m1a_column_carpentry_first_binding.py
