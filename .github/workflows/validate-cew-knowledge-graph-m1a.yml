name: Validate CEW Knowledge Graph M1A Slice

on:
  pull_request:
    paths:
      - 'automation/CEW_KNOWLEDGE_GRAPH_CONTRACT_v1.json'
      - 'data/canonical/M1A_TAV05A_GROUP_REINFORCEMENT_v1.csv'
      - 'data/canonical/M1A_TAV05A_GROUP_TRANSCRIPTION_GATE_v1.csv'
      - 'data/canonical/CEW_SYSTEM_MILESTONES_v1.csv'
      - 'scripts/project_cew_m1a_knowledge_graph.py'
      - 'scripts/validate_cew_knowledge_graph_m1a_slice.py'
      - '.github/workflows/validate-cew-knowledge-graph-m1a.yml'
  push:
    branches:
      - 'work/cew-f5-knowledge-graph-from-e7c0'
    paths:
      - 'automation/CEW_KNOWLEDGE_GRAPH_CONTRACT_v1.json'
      - 'data/canonical/M1A_TAV05A_GROUP_REINFORCEMENT_v1.csv'
      - 'data/canonical/M1A_TAV05A_GROUP_TRANSCRIPTION_GATE_v1.csv'
      - 'data/canonical/CEW_SYSTEM_MILESTONES_v1.csv'
      - 'scripts/project_cew_m1a_knowledge_graph.py'
      - 'scripts/validate_cew_knowledge_graph_m1a_slice.py'
      - '.github/workflows/validate-cew-knowledge-graph-m1a.yml'
  workflow_dispatch:

jobs:
  m1a-graph-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CEW milestone governance
        run: python scripts/validate_cew_system_foundation.py
      - name: Project M1A TAV-05A reinforcement into graph
        run: python scripts/project_cew_m1a_knowledge_graph.py --out cew-f5-m1a-graph
      - name: Validate M1A graph projection without authority loss
        run: python scripts/validate_cew_knowledge_graph_m1a_slice.py --projection cew-f5-m1a-graph/m1a_graph_projection.json
      - name: Upload M1A graph projection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cew-f5-m1a-graph
          path: cew-f5-m1a-graph/
          if-no-files-found: error
          retention-days: 14
