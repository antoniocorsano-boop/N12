name: Validate CEW Knowledge Graph M1L Slice

on:
  pull_request:
    paths:
      - 'automation/CEW_KNOWLEDGE_GRAPH_CONTRACT_v1.json'
      - 'data/canonical/M1L_LOAD_MODEL_CURRENT_v1.csv'
      - 'data/canonical/M1L_LOAD_PATH_CLASSIFICATION_CURRENT_v1.csv'
      - 'data/canonical/M1L_HISTORICAL_VS_ASBUILT_LOAD_DELTA_REGISTER_v1.csv'
      - 'data/canonical/CEW_SYSTEM_MILESTONES_v1.csv'
      - 'scripts/project_cew_m1l_knowledge_graph.py'
      - 'scripts/validate_cew_knowledge_graph_m1l_slice.py'
      - '.github/workflows/validate-cew-knowledge-graph-m1l.yml'
  push:
    branches:
      - 'work/cew-f5-knowledge-graph-from-e7c0'
    paths:
      - 'automation/CEW_KNOWLEDGE_GRAPH_CONTRACT_v1.json'
      - 'data/canonical/M1L_LOAD_MODEL_CURRENT_v1.csv'
      - 'data/canonical/M1L_LOAD_PATH_CLASSIFICATION_CURRENT_v1.csv'
      - 'data/canonical/M1L_HISTORICAL_VS_ASBUILT_LOAD_DELTA_REGISTER_v1.csv'
      - 'data/canonical/CEW_SYSTEM_MILESTONES_v1.csv'
      - 'scripts/project_cew_m1l_knowledge_graph.py'
      - 'scripts/validate_cew_knowledge_graph_m1l_slice.py'
      - '.github/workflows/validate-cew-knowledge-graph-m1l.yml'
  workflow_dispatch:

jobs:
  m1l-graph-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CEW milestone governance
        run: python scripts/validate_cew_system_foundation.py
      - name: Project M1L load model into graph
        run: python scripts/project_cew_m1l_knowledge_graph.py --out cew-f5-m1l-graph
      - name: Validate M1L graph projection without authority loss
        run: python scripts/validate_cew_knowledge_graph_m1l_slice.py --projection cew-f5-m1l-graph/m1l_graph_projection.json
      - name: Upload M1L graph projection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cew-f5-m1l-graph
          path: cew-f5-m1l-graph/
          if-no-files-found: error
          retention-days: 14
