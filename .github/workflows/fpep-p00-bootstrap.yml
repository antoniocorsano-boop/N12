name: FPEP P00 Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - work/m0-global-model
    paths:
      - 'automation/N12_FOUNDATION_WORK_QUEUE_v1.json'
      - 'automation/N12_WORK_QUEUE_v1.json'
      - 'knowledge/KNOWLEDGE_MANIFEST.json'
      - 'knowledge/CURRENT_STATE.json'
      - 'knowledge/ARTIFACT_REGISTRY.csv'
      - 'knowledge/ARTIFACT_REGISTRY_*_PATCH_v1.csv'
      - 'docs/REGISTRO_MASTER.md'
      - 'scripts/fpep_p00_state_consistency.py'
      - 'scripts/n12_foundation_orchestrator.py'
      - 'scripts/validate_foundation_pipeline.py'
      - '.github/workflows/fpep-p00-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: fpep-p00-bootstrap-work-m0-global-model
  cancel-in-progress: false

jobs:
  p00-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical working branch
        uses: actions/checkout@v4
        with:
          ref: work/m0-global-model
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect selected P00 state
        id: selection
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          queue = json.loads(Path('automation/N12_FOUNDATION_WORK_QUEUE_v1.json').read_text(encoding='utf-8'))
          item = next((x for x in queue.get('items', []) if x.get('id') == 'FPEP-P00-STATE-CONSISTENCY'), None)
          active = bool(item and item.get('state') in {'READY', 'IN_PROGRESS', 'RESIDUAL'})
          print(f"active={'true' if active else 'false'}")
          print(f"state={item.get('state') if item else 'MISSING'}")
          PY

      - name: Validate P00 contracts before execution
        if: steps.selection.outputs.active == 'true'
        run: |
          python scripts/validate_knowledge_system.py
          python scripts/validate_foundation_pipeline.py
          python scripts/n12_foundation_orchestrator.py validate

      - name: Generate deterministic P00 result when inbox is empty
        if: steps.selection.outputs.active == 'true'
        shell: bash
        run: |
          if [ -f automation/inbox/N12_FOUNDATION_AGENT_RESULT.json ]; then
            echo 'FPEP inbox already contains one pending result; bootstrap will not overwrite it.'
          else
            python scripts/fpep_p00_state_consistency.py
          fi

      - name: Ingest exactly one P00 result
        if: steps.selection.outputs.active == 'true'
        shell: bash
        run: |
          if [ ! -f automation/inbox/N12_FOUNDATION_AGENT_RESULT.json ]; then
            echo 'P00 did not produce a result inbox packet.' >&2
            exit 1
          fi
          python scripts/n12_foundation_orchestrator.py ingest

      - name: Revalidate persisted candidate state
        if: steps.selection.outputs.active == 'true'
        run: |
          python scripts/validate_foundation_pipeline.py
          python scripts/n12_foundation_orchestrator.py validate
          python scripts/validate_knowledge_system.py

      - name: Persist P00 audit receipt and subqueue transition
        if: steps.selection.outputs.active == 'true'
        shell: bash
        run: |
          git config user.name 'n12-fpep-p00-bootstrap[bot]'
          git config user.email 'n12-fpep-p00-bootstrap[bot]@users.noreply.github.com'
          git add automation/N12_FOUNDATION_WORK_QUEUE_v1.json
          git add -A automation/receipts/foundation || true
          git add -A automation/inbox || true
          git add -A analysis/fpep || true
          if git diff --cached --quiet; then
            echo 'P00 produced no canonical state change.'
          else
            git commit -m 'automation: execute FPEP P00 state consistency gate'
            git pull --rebase origin work/m0-global-model
            git push origin HEAD:work/m0-global-model
          fi

      - name: Report bootstrap state
        run: |
          echo "FPEP P00 selected: ${{ steps.selection.outputs.active }}"
          echo "FPEP P00 state: ${{ steps.selection.outputs.state }}"
