name: CEW-CAL-01 Primary Metric Calibration

on:
  push:
    branches:
      - feat/cew-cal01-primary-metric-calibration
  pull_request:
    paths:
      - 'experiments/cew_cal01/**'
      - 'tests/cew_cal01/**'
      - 'governance/cew-cal01/**'
      - 'requirements/cew-cal01.lock.txt'
      - 'docs/superpowers/specs/2026-11-01-cew-cal01-primary-metric-calibration-design.md'
      - 'docs/superpowers/specs/2026-11-01-cew-cal01-perimeter-dimension-chain-design.md'
      - 'docs/superpowers/specs/2026-11-01-cew-cal01-internal-dimension-chain-design.md'
      - 'docs/superpowers/specs/2026-11-02-cew-cal01-structural-grid-primary-sources-design.md'
      - 'docs/superpowers/plans/2026-11-01-cew-cal01-primary-metric-calibration.md'
      - 'docs/superpowers/plans/2026-11-01-cew-cal01-perimeter-dimension-chain.md'
      - 'docs/superpowers/plans/2026-11-01-cew-cal01-internal-dimension-chain.md'
      - 'docs/superpowers/plans/2026-11-02-cew-cal01-structural-grid-primary-sources.md'
      - '.github/workflows/validate-cew-cal01.yml'

jobs:
  cal01-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Run CEW-CAL-01 contracts
        run: python -m unittest discover -s tests/cew_cal01 -p 'test_*.py' -v

  cal01-structural-grid-source-discovery:
    needs: cal01-contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Install frozen Tesseract system package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version | head -1
      - name: Install minimal CAL-01 exact-source toolchain
        run: python -m pip install --disable-pip-version-check -r requirements/cew-cal01.lock.txt
      - name: Fetch frozen structural-grid source commit
        run: |
          rm -rf "$RUNNER_TEMP/cew-n12-structural-grid-source"
          git init -q "$RUNNER_TEMP/cew-n12-structural-grid-source"
          git -C "$RUNNER_TEMP/cew-n12-structural-grid-source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/cew-n12-structural-grid-source" fetch --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9
          git -C "$RUNNER_TEMP/cew-n12-structural-grid-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cew-n12-structural-grid-source" rev-parse HEAD)" = "78c20a52db4f391ce0d13b9705b9f04737e218c9"
      - name: Render frozen TAV-01S and TAV-02S structural grid sources
        run: |
          rm -rf "$RUNNER_TEMP/cew-cal01-structural-grid"
          python -m experiments.cew_cal01.structural_grid_sources \
            --source-repo "$RUNNER_TEMP/cew-n12-structural-grid-source" \
            --output-dir "$RUNNER_TEMP/cew-cal01-structural-grid"
      - name: Discover structural grid dimension chains
        run: |
          python -m experiments.cew_cal01.structural_grid_dimension \
            --source-manifest "$RUNNER_TEMP/cew-cal01-structural-grid/structural-grid-primary-sources.json" \
            --raster-root "$RUNNER_TEMP/cew-cal01-structural-grid" \
            --output-dir "$RUNNER_TEMP/cew-cal01-structural-grid/discovery"
      - name: Assert structural grid source and authority boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cew-cal01-structural-grid'
          manifest = json.loads((root / 'structural-grid-primary-sources.json').read_text())
          summary = json.loads((root / 'discovery' / 'structural-grid-cross-sheet-summary.json').read_text())
          expected = {
              'TAV-01S': 'abd6061c305f2e7222f04659f519d7ee73ed0759b815ac994ff66215f060fec8',
              'TAV-02S': 'cd03839589e60ee46b3fd398d6a9fabca1a446859e6693a47d0f83d0e930520f',
          }
          assert manifest['source_count'] == 2
          assert [row['source_id'] for row in manifest['sources']] == ['TAV-01S', 'TAV-02S']
          assert manifest['primary_anchor_count'] == 0
          assert manifest['historical_comparator_loaded'] is False
          assert manifest['historical_affine_loaded'] is False
          assert manifest['authority']['canonical_geometry_authorized'] is False
          assert manifest['authority']['canonical_write_authorized'] is False
          assert summary['source_order'] == ['TAV-01S', 'TAV-02S']
          assert summary['cross_sheet_relation_count'] == 0
          assert summary['cross_sheet_matching_status'] == 'PENDING_HUMAN_VALIDATION'
          assert summary['primary_anchor_count'] == 0
          assert summary['authority']['canonical_geometry_authorized'] is False
          results = {}
          for source in manifest['sources']:
              source_id = source['source_id']
              assert source['sha256'] == expected[source_id]
              discovery = json.loads((root / 'discovery' / source_id / 'structural-grid-dimension-discovery.json').read_text())
              assert discovery['source']['source_id'] == source_id
              assert discovery['source']['sha256'] == expected[source_id]
              assert len(discovery['bands']) == 4
              assert [row['side'] for row in discovery['bands']] == ['TOP', 'RIGHT', 'BOTTOM', 'LEFT']
              assert discovery['candidate_count'] <= discovery['numeric_observation_count']
              assert discovery['primary_anchor_count'] == 0
              assert discovery['historical_comparator_loaded'] is False
              assert discovery['historical_affine_loaded'] is False
              assert discovery['authority']['canonical_geometry_authorized'] is False
              assert discovery['authority']['canonical_write_authorized'] is False
              assert all(row['semantic_role'] == 'STRUCTURAL_GRID_LINEAR_DIMENSION_CANDIDATE' for row in discovery['candidates'])
              assert all(row['fit_eligible'] is False for row in discovery['candidates'])
              results[source_id] = {
                  'numeric_observation_count': discovery['numeric_observation_count'],
                  'candidate_count': discovery['candidate_count'],
                  'status': discovery['status'],
                  'discovery_digest': discovery['discovery_digest'],
              }
          print(json.dumps({
              'TAV-01S': results['TAV-01S'],
              'TAV-02S': results['TAV-02S'],
              'cross_sheet_digest': summary['cross_sheet_digest'],
              'primary_anchor_count': summary['primary_anchor_count'],
          }, sort_keys=True))
          PY
      - name: Upload governed structural grid primary source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-cal01-structural-grid-primary-sources
          path: ${{ runner.temp }}/cew-cal01-structural-grid
          if-no-files-found: error
          retention-days: 30

  cal01-exact-source-dimension-discovery:
    needs: cal01-contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Install frozen Tesseract system package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version | head -1
      - name: Install minimal CAL-01 exact-source toolchain
        run: python -m pip install --disable-pip-version-check -r requirements/cew-cal01.lock.txt
      - name: Fetch frozen TAV.5 source commit
        run: |
          rm -rf "$RUNNER_TEMP/cew-n12-source"
          git init -q "$RUNNER_TEMP/cew-n12-source"
          git -C "$RUNNER_TEMP/cew-n12-source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/cew-n12-source" fetch --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9
          git -C "$RUNNER_TEMP/cew-n12-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cew-n12-source" rev-parse HEAD)" = "78c20a52db4f391ce0d13b9705b9f04737e218c9"
      - name: Discover exact-source TAV.5 dimension proposals
        run: |
          rm -rf "$RUNNER_TEMP/cew-cal01-dimension-discovery"
          python -m experiments.cew_cal01.exact_source \
            --source-repo "$RUNNER_TEMP/cew-n12-source" \
            --output-dir "$RUNNER_TEMP/cew-cal01-dimension-discovery"
      - name: Discover perimeter TAV.5 dimension chains
        run: |
          python -m experiments.cew_cal01.perimeter_dimension \
            --image "$RUNNER_TEMP/cew-cal01-dimension-discovery/tav5-primary-300dpi.png" \
            --base-discovery "$RUNNER_TEMP/cew-cal01-dimension-discovery/dimension-discovery.json" \
            --output-dir "$RUNNER_TEMP/cew-cal01-dimension-discovery/perimeter"
      - name: Discover internal TAV.5 dimension chains
        run: |
          python -m experiments.cew_cal01.internal_dimension \
            --image "$RUNNER_TEMP/cew-cal01-dimension-discovery/tav5-primary-300dpi.png" \
            --base-discovery "$RUNNER_TEMP/cew-cal01-dimension-discovery/dimension-discovery.json" \
            --perimeter-discovery "$RUNNER_TEMP/cew-cal01-dimension-discovery/perimeter/perimeter-dimension-discovery.json" \
            --output-dir "$RUNNER_TEMP/cew-cal01-dimension-discovery/internal"
      - name: Discover oriented tiled TAV.5 dimension proposals
        run: |
          python -m experiments.cew_cal01.oriented_discovery \
            --image "$RUNNER_TEMP/cew-cal01-dimension-discovery/tav5-primary-300dpi.png" \
            --base-discovery "$RUNNER_TEMP/cew-cal01-dimension-discovery/dimension-discovery.json" \
            --output-dir "$RUNNER_TEMP/cew-cal01-dimension-discovery/oriented"
      - name: Replay semantic numeric roles on exact-source clusters
        run: |
          python -m experiments.cew_cal01.semantic_exact_source \
            --image "$RUNNER_TEMP/cew-cal01-dimension-discovery/tav5-primary-300dpi.png" \
            --oriented-discovery "$RUNNER_TEMP/cew-cal01-dimension-discovery/oriented/oriented-dimension-discovery.json" \
            --output-dir "$RUNNER_TEMP/cew-cal01-dimension-discovery/semantic"
      - name: Replay tight-local OCR on OCR-insufficient clusters
        run: |
          python -m experiments.cew_cal01.tight_exact_source \
            --image "$RUNNER_TEMP/cew-cal01-dimension-discovery/tav5-primary-300dpi.png" \
            --oriented-discovery "$RUNNER_TEMP/cew-cal01-dimension-discovery/oriented/oriented-dimension-discovery.json" \
            --semantic-replay "$RUNNER_TEMP/cew-cal01-dimension-discovery/semantic/semantic-role-replay.json" \
            --output-dir "$RUNNER_TEMP/cew-cal01-dimension-discovery/tight"
      - name: Assert exact-source discovery semantic, perimeter, internal and tight boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cew-cal01-dimension-discovery'
          data = json.loads((root / 'dimension-discovery.json').read_text())
          perimeter = json.loads((root / 'perimeter' / 'perimeter-dimension-discovery.json').read_text())
          internal = json.loads((root / 'internal' / 'internal-dimension-discovery.json').read_text())
          oriented = json.loads((root / 'oriented' / 'oriented-dimension-discovery.json').read_text())
          semantic = json.loads((root / 'semantic' / 'semantic-role-replay.json').read_text())
          tight = json.loads((root / 'tight' / 'tight-exact-source-replay.json').read_text())
          expected_sha = '2143dbcfb101c7a83d0c5c7a59a11ceabdaf7d8b2568a7aeeae61fa60e66f580'
          assert data['source']['sha256'] == expected_sha
          assert perimeter['source']['sha256'] == expected_sha
          assert internal['source']['sha256'] == expected_sha
          assert oriented['source']['sha256'] == expected_sha
          assert semantic['source']['sha256'] == expected_sha
          assert tight['source']['sha256'] == expected_sha
          assert data['numeric_proposal_count'] > 0
          for payload in (data, perimeter, internal, oriented, semantic, tight):
              assert payload['historical_comparator_loaded'] is False
              assert payload['historical_affine_loaded'] is False
              assert payload['tav02s_evidence_loaded'] is False
              assert payload['primary_anchor_count'] == 0
              assert payload['authority']['canonical_geometry_authorized'] is False
              assert payload['authority']['canonical_write_authorized'] is False
          assert len(perimeter['bands']) == 4
          assert [row['side'] for row in perimeter['bands']] == ['TOP', 'RIGHT', 'BOTTOM', 'LEFT']
          assert perimeter['candidate_count'] <= perimeter['numeric_observation_count']
          assert perimeter['status'] in {
              'PERIMETER_DIMENSION_CHAINS_OBSERVED',
              'PERIMETER_DIMENSION_CHAINS_NOT_OBSERVED',
          }
          assert all(row['semantic_role'] == 'PERIMETER_LINEAR_DIMENSION_CANDIDATE' for row in perimeter['candidates'])
          assert internal['perimeter_trigger']['candidate_count'] == 0
          assert internal['perimeter_trigger']['status'] == 'PERIMETER_DIMENSION_CHAINS_NOT_OBSERVED'
          assert internal['primary_anchor_count'] == 0
          assert internal['candidate_count'] <= internal['location_cluster_count']
          assert internal['status'] in {
              'INTERNAL_LINEAR_DIMENSION_CANDIDATES_OBSERVED',
              'INTERNAL_DIMENSION_CHAINS_NOT_OBSERVED',
          }
          assert all(row['semantic_role'] == 'INTERNAL_LINEAR_DIMENSION_CANDIDATE' for row in internal['candidates'])
          assert oriented['tile_strategy']['rotations_degrees'] == [0, 90, 180, 270]
          assert oriented['tile_count_selected'] > 0
          assert oriented['ocr_pass_count'] == oriented['tile_count_selected'] * 4
          assert oriented['raw_numeric_observation_count'] >= oriented['oriented_numeric_proposal_count']
          assert oriented['location_cluster_count'] > 0
          assert len(oriented['location_clusters']) == oriented['location_cluster_count']
          assert semantic['location_cluster_count'] == oriented['location_cluster_count']
          assert sum(semantic['role_counts'].values()) == semantic['location_cluster_count']
          expected_tight = sorted(
              int(row['cluster_index'])
              for row in semantic['results']
              if row.get('reason') == 'OCR_CONSENSUS_INSUFFICIENT'
          )
          assert [row['cluster_index'] for row in tight['rows']] == expected_tight
          assert tight['cluster_count'] == len(expected_tight)
          assert tight['selection_reason'] == 'SEMANTIC_REASON_OCR_CONSENSUS_INSUFFICIENT_ONLY'
          assert tight['authority']['engineering_authority_effect'] == 'NONE'
          print(json.dumps({
              'global_numeric_proposal_count': data['numeric_proposal_count'],
              'perimeter_numeric_observation_count': perimeter['numeric_observation_count'],
              'perimeter_candidate_count': perimeter['candidate_count'],
              'perimeter_status': perimeter['status'],
              'perimeter_discovery_digest': perimeter['perimeter_discovery_digest'],
              'internal_numeric_observation_count': internal['numeric_observation_count'],
              'internal_location_cluster_count': internal['location_cluster_count'],
              'internal_role_counts': internal['role_counts'],
              'internal_candidate_count': internal['candidate_count'],
              'internal_status': internal['status'],
              'internal_discovery_digest': internal['internal_discovery_digest'],
              'location_cluster_count': oriented['location_cluster_count'],
              'semantic_consensus_confirmed_count': semantic['consensus_confirmed_count'],
              'semantic_role_counts': semantic['role_counts'],
              'tight_cluster_count': tight['cluster_count'],
              'tight_consensus_confirmed_count': tight['tight_consensus_confirmed_count'],
              'tight_confirmed_text_counts': tight['confirmed_text_counts'],
              'tight_replay_digest': tight['tight_replay_digest'],
          }, sort_keys=True))
          PY
      - name: Upload governed CAL-01 dimension discovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-cal01-primary-dimension-discovery
          path: ${{ runner.temp }}/cew-cal01-dimension-discovery
          if-no-files-found: error
          retention-days: 30
