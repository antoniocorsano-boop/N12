name: CEW-B01 Beam-Hosted Marker Exact-Source Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/validate-cew-b01-beam-hosted-marker-exact-source.yml'
      - 'experiments/cew_b01/beam_hosted_markers.py'
      - 'experiments/cew_b01/beam_hosted_marker_raster.py'
      - 'experiments/cew_b01/beam_hosted_marker_hybrid.py'
      - 'governance/cew-b01/N12_TAV5_SOURCE_v1.json'
      - 'governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json'
      - 'requirements/cew-b01.lock.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-hosted-marker-exact-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Install frozen Tesseract system package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'

      - name: Install frozen B01 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cew-b01-hosted-marker"
          source "$RUNNER_TEMP/cew-b01-hosted-marker/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/cew-b01.lock.txt
          python -m pip check

      - name: Fetch frozen archival source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9

      - name: Execute exact TAV.5 hosted-marker replay twice
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-b01-hosted-marker/bin/activate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import cv2

          from cew_b01.document_zoning import propose_document_zones
          from cew_b01.evidence_schema import Task3RasterBinding
          from cew_b01.pdf_probe import probe_pdf
          from cew_b01.primitive_census import (
              _analysis_binary,
              _confirmed_analysis_mask,
              extract_neutral_primitives,
          )
          from cew_b01.source_contract import load_source_contract, materialize_source
          from cew_b01.zone_review_package import confirmed_zones_from_receipt, zone_set_digest
          from experiments.cew_b01.beam_hosted_marker_hybrid import build_hybrid_hosted_marker_candidates
          from experiments.cew_b01.beam_hosted_markers import build_line_tracks, build_linear_carriers

          SOURCE_SHA = '2143dbcfb101c7a83d0c5c7a59a11ceabdaf7d8b2568a7aeeae61fa60e66f580'
          C5 = 'CEW-B01-GP-90cefb124e0b97a63acd1d9c'
          C7 = 'CEW-B01-GP-f5bf9ee85705380152aae053'

          def canonical_bytes(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode('utf-8')

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          out = Path('evidence/cew-b01/beam-hosted-marker-pilot')
          out.mkdir(parents=True, exist_ok=True)

          contract = load_source_contract('governance/cew-b01/N12_TAV5_SOURCE_v1.json')
          materialized = materialize_source(contract, '.', runner_temp / 'tavola5-hosted-marker-source.pdf')
          assert materialized.sha256 == SOURCE_SHA

          probe_dir = runner_temp / 'cew-b01-hosted-marker-probe'
          probe = probe_pdf(materialized, probe_dir)
          binding = Task3RasterBinding.from_probe_mapping(probe.to_mapping())
          raster_path = probe_dir / 'tav5-page0-300dpi.png'

          proposed_zones = propose_document_zones(binding, raster_path)
          receipt = json.loads(Path('governance/cew-b01/TAV5_DOCUMENT_ZONE_REVIEW_v1.json').read_text(encoding='utf-8'))
          zones = confirmed_zones_from_receipt(binding, proposed_zones, receipt)
          assert all(zone.human_confirmed for zone in zones)
          assert zone_set_digest(zones) == receipt['zone_set_digest']

          primitives_a = extract_neutral_primitives(binding, raster_path, zones)
          primitives_b = extract_neutral_primitives(binding, raster_path, zones)
          mappings_a = [item.to_mapping() for item in primitives_a]
          mappings_b = [item.to_mapping() for item in primitives_b]
          assert canonical_bytes(mappings_a) == canonical_bytes(mappings_b)
          assert len(mappings_a) == 5633

          axis_line_count = sum(
              item.get('family') == 'LINE_SEGMENT'
              and item.get('feature_signature', {}).get('orientation') in {'HORIZONTAL', 'VERTICAL'}
              for item in mappings_a
          )
          assert axis_line_count == 733

          image = cv2.imread(str(raster_path), cv2.IMREAD_GRAYSCALE)
          assert image is not None
          mask = _confirmed_analysis_mask(binding, zones)
          _analysis, binary = _analysis_binary(image, mask)
          binary_bool = binary > 0

          result_a = build_hybrid_hosted_marker_candidates(mappings_a, [C5, C7], binary_bool)
          result_b = build_hybrid_hosted_marker_candidates(mappings_a, [C5, C7], binary_bool)
          assert canonical_bytes(result_a) == canonical_bytes(result_b)
          assert {item['marker_primitive_id'] for item in result_a} == {C5, C7}

          by_seed = {item['marker_primitive_id']: item for item in result_a}
          assert by_seed[C5]['graphical_state'] == 'RECT_ALONE_ON_CARRIER', by_seed[C5]
          assert by_seed[C7]['graphical_state'] == 'RECT_PLUS_TRANSVERSE_PAIR_CANDIDATE', by_seed[C7]
          assert by_seed[C7]['raster_transverse_evidence']['pair_detected'] is True
          assert 'RASTER_LOCAL_PROFILE' in by_seed[C7]['pair_evidence_sources']
          assert by_seed[C5]['semantic_meaning'] is None and by_seed[C7]['semantic_meaning'] is None
          assert all(item['structural_identity_authorized'] is False for item in result_a)
          assert all(item['canonical_write_authorized'] is False for item in result_a)
          assert all(item['g3_authorized'] is False for item in result_a)
          assert all(item['merge_authorized'] is False for item in result_a)

          tracks = build_line_tracks(mappings_a)
          carriers = build_linear_carriers(tracks)
          replay_payload = {
              'schema_id': 'CEW_B01_BEAM_HOSTED_MARKER_EXACT_SOURCE_REPLAY',
              'schema_version': 1,
              'status': 'EXPERIMENT_ONLY',
              'source_sha256': materialized.sha256,
              'page_index': contract.page_index,
              'raster_width_px': binding.raster_width_px,
              'raster_height_px': binding.raster_height_px,
              'raster_sha256': binding.raster_sha256,
              'zone_set_digest': zone_set_digest(zones),
              'primitive_count': len(mappings_a),
              'axis_line_segment_count': axis_line_count,
              'qualified_g1_parallel_pair_input_cap': 220,
              'reconstructed_line_track_count': len(tracks),
              'neutral_carrier_candidate_count': len(carriers),
              'frozen_seed_ids': [C5, C7],
              'candidates': result_a,
              'human_semantic_hypotheses': {
                  'RECT_ALONE_ON_CARRIER': {
                      'proposed_meaning': 'BEAM_DOES_NOT_CARRY_SLAB',
                      'status': 'UNVALIDATED_HUMAN_HYPOTHESIS',
                  },
                  'RECT_PLUS_TRANSVERSE_PAIR_CANDIDATE': {
                      'proposed_meaning': 'BEAM_CARRIES_SLAB',
                      'status': 'UNVALIDATED_HUMAN_HYPOTHESIS',
                  },
              },
              'authority': {
                  'semantic_classification_authorized': False,
                  'structural_identity_authorized': False,
                  'canonical_write_authorized': False,
                  'g2c_promotion_authorized': False,
                  'g3_authorized': False,
                  'merge_authorized': False,
              },
          }
          replay_raw = canonical_bytes(replay_payload)
          replay_digest = hashlib.sha256(replay_raw).hexdigest()
          replay_payload['replay_sha256'] = replay_digest
          (out / 'exact-source-result.json').write_text(
              json.dumps(replay_payload, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          # Render a bounded diagnostic atlas directly in exact raster coordinates.
          colour = cv2.cvtColor(image, cv2.COLOR_GRAY2BGR)
          panels = []
          for label, seed in [('C5', C5), ('C7', C7)]:
              candidate = by_seed[seed]
              geometry = candidate['marker_geometry']
              x0 = int(round(geometry['x']))
              y0 = int(round(geometry['y']))
              x1 = int(round(geometry['x'] + geometry['width']))
              y1 = int(round(geometry['y'] + geometry['height']))
              margin_x = max(250, int(round(geometry['width'] * 4)))
              margin_y = max(220, int(round(geometry['height'] * 5)))
              left = max(0, x0 - margin_x)
              top = max(0, y0 - margin_y)
              right = min(colour.shape[1], x1 + margin_x)
              bottom = min(colour.shape[0], y1 + margin_y)
              crop = colour[top:bottom, left:right].copy()
              cv2.rectangle(crop, (x0-left, y0-top), (x1-left, y1-top), (0,0,255), 4)
              ev = candidate['raster_transverse_evidence']
              if ev.get('pair_detected'):
                  if candidate['carrier_orientation'] == 'HORIZONTAL':
                      for stroke in ev['pair_strokes']:
                          sx = int(round(float(stroke['center']))) - left
                          cv2.line(crop, (sx, max(0, int(ev['cross_search_start'])-top)), (sx, min(crop.shape[0]-1, int(ev['cross_search_end'])-top)), (255,0,0), 3)
                  else:
                      for stroke in ev['pair_strokes']:
                          sy = int(round(float(stroke['center']))) - top
                          cv2.line(crop, (max(0, int(ev['cross_search_start'])-left), sy), (min(crop.shape[1]-1, int(ev['cross_search_end'])-left), sy), (255,0,0), 3)
              cv2.putText(crop, label + ' ' + candidate['graphical_state'], (12, 30), cv2.FONT_HERSHEY_SIMPLEX, 0.65, (0,0,0), 2, cv2.LINE_AA)
              target_w = 900
              scale = min(1.0, target_w / crop.shape[1])
              if scale < 1.0:
                  crop = cv2.resize(crop, (int(round(crop.shape[1]*scale)), int(round(crop.shape[0]*scale))), interpolation=cv2.INTER_AREA)
              panels.append(crop)

          max_w = max(panel.shape[1] for panel in panels)
          padded = []
          for panel in panels:
              if panel.shape[1] < max_w:
                  panel = cv2.copyMakeBorder(panel, 0, 0, 0, max_w-panel.shape[1], cv2.BORDER_CONSTANT, value=(255,255,255))
              padded.append(panel)
          atlas = cv2.vconcat(padded)
          cv2.imwrite(str(out / 'c5-c7-exact-source-atlas.png'), atlas)

          summary = {
              'source_sha256': materialized.sha256,
              'primitive_count': len(mappings_a),
              'axis_line_segment_count': axis_line_count,
              'states': {seed: by_seed[seed]['graphical_state'] for seed in [C5, C7]},
              'replay_sha256': replay_digest,
              'semantic_authority': False,
              'g3_authorized': False,
              'merge_authorized': False,
          }
          print('BEAM_HOSTED_MARKER_EXACT_SOURCE=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload exact-source hosted-marker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cew-b01-beam-hosted-marker-exact-source
          path: evidence/cew-b01/beam-hosted-marker-pilot/
          if-no-files-found: error
          retention-days: 30
