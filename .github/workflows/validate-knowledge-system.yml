name: Validate N12 Knowledge System

on:
  push:
    branches:
      - main
      - work/m0-global-model
    paths:
      - 'AGENTS.md'
      - 'automation/**'
      - 'knowledge/**'
      - 'docs/**'
      - 'data/canonical/**'
      - 'skills/**'
      - 'scripts/**'
      - 'analysis/source_renders/TAV02S/**'
      - '.github/workflows/validate-knowledge-system.yml'
      - '.github/workflows/n12-analysis-orchestrator.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'automation/**'
      - 'knowledge/**'
      - 'docs/**'
      - 'data/canonical/**'
      - 'skills/**'
      - 'scripts/**'
      - 'analysis/source_renders/TAV02S/**'
      - '.github/workflows/validate-knowledge-system.yml'
      - '.github/workflows/n12-analysis-orchestrator.yml'

jobs:
  knowledge-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate knowledge architecture
        run: python scripts/validate_knowledge_system.py

      - name: Validate agent bootstrap
        run: python scripts/agent_bootstrap.py > /tmp/n12-agent-bootstrap.json

      - name: Validate cyclic automation contract and queue
        run: python scripts/n12_orchestrator.py validate

      - name: Report cyclic next work item
        run: python scripts/n12_orchestrator.py status > /tmp/n12-cycle-status.json

      - name: Validate carpenteria semantic registries
        run: python skills/pt-carpentry-reader/runner.py validate

      - name: Validate G1-B raster support bindings
        run: python scripts/validate_pt_raster_support_bindings.py

      - name: Report PT raster reconstruction gate
        run: python skills/pt-raster-grid-reconstructor/runner.py status

      - name: Install OpenCV for G1 candidate extraction
        run: pip install --disable-pip-version-check opencv-python-headless==4.10.0.84 numpy

      - name: Extract G1 non-authoritative raster candidates
        run: python scripts/extract_pt_raster_candidates.py

      - name: Upload machine state reports
        uses: actions/upload-artifact@v4
        with:
          name: n12-machine-state-reports
          path: |
            /tmp/n12-agent-bootstrap.json
            /tmp/n12-cycle-status.json
          if-no-files-found: error

      - name: Upload G1 raster candidate review artifact
        uses: actions/upload-artifact@v4
        with:
          name: pt-raster-geometric-candidates-v1
          path: analysis/pt_raster_candidates/
          if-no-files-found: error

  ingest-canonical-result:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/m0-global-model'
    needs: knowledge-contracts
    runs-on: ubuntu-latest
    concurrency:
      group: n12-structural-analysis-cycle
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout canonical working branch
        uses: actions/checkout@v4
        with:
          ref: work/m0-global-model
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover roof-special nonblocking candidate when applicable
        run: python scripts/n12_finalize_roof_special_3d.py

      - name: Validate pending specialist result
        shell: bash
        run: |
          python scripts/validate_knowledge_system.py
          python scripts/n12_orchestrator.py validate
          if [ -f automation/inbox/N12_AGENT_RESULT.json ]; then
            python scripts/n12_ingest_agent_result.py validate
          else
            echo 'No specialist result in inbox.'
          fi

      - name: Ingest exactly one pending specialist result
        id: ingest
        shell: bash
        run: |
          if [ -f automation/inbox/N12_AGENT_RESULT.json ]; then
            python scripts/n12_ingest_agent_result.py apply
            echo 'ingested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ingested=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Revalidate and persist deterministic advancement
        if: steps.ingest.outputs.ingested == 'true'
        shell: bash
        run: |
          python scripts/validate_knowledge_system.py
          python scripts/n12_orchestrator.py validate
          git config user.name 'n12-analysis-orchestrator[bot]'
          git config user.email 'n12-analysis-orchestrator[bot]@users.noreply.github.com'
          git add automation/N12_WORK_QUEUE_v1.json knowledge/CURRENT_STATE.json
          git add -A automation/receipts || true
          git add -A automation/inbox || true
          git add data/canonical/ROOF_G5_SPECIAL_FEATURES_3D_CURRENT_v1.csv || true
          git add analysis/automation/M0G_RESOLVE_ROOF_SPECIAL_3D_AUDIT_v1.csv || true
          git add knowledge/ARTIFACT_REGISTRY_AUTOMATION_PATCH_v1.csv || true
          if git diff --cached --quiet; then
            echo 'No state advancement to commit.'
          else
            git commit -m 'automation: finalize roof-special 3D and advance cycle'
            git push origin HEAD:work/m0-global-model
          fi
