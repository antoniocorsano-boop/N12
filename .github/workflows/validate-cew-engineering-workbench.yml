name: Validate CEW Engineering Workbench

on:
  pull_request:
    paths:
      - 'ui/workbench/**'
      - 'docs/UX/CEW_ENGINEERING_WORKBENCH_v0.md'
      - 'scripts/cew_workbench_stage_tav06a.sh'
      - 'scripts/validate_cew_engineering_workbench.py'
      - '.github/workflows/validate-cew-engineering-workbench.yml'
  push:
    branches:
      - 'exp/cew-engineering-workbench-v0'
    paths:
      - 'ui/workbench/**'
      - 'docs/UX/CEW_ENGINEERING_WORKBENCH_v0.md'
      - 'scripts/cew_workbench_stage_tav06a.sh'
      - 'scripts/validate_cew_engineering_workbench.py'
      - '.github/workflows/validate-cew-engineering-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui/workbench
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CEW UX1 authority and interaction contract
        working-directory: .
        run: python scripts/validate_cew_engineering_workbench.py

      - name: Install source-render prerequisites
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Stage pinned TAV06A primary-source review raster
        working-directory: .
        run: bash scripts/cew_workbench_stage_tav06a.sh ui/workbench

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build workbench
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run professional interaction and accessibility tests
        run: npm run test:e2e

      - name: Upload workbench build
        uses: actions/upload-artifact@v4
        with:
          name: CEW_ENGINEERING_WORKBENCH_UX1
          path: |
            ui/workbench/dist
            ui/workbench/storybook-static
          if-no-files-found: error
