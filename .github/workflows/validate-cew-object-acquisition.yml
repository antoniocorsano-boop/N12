name: Validate CEW Object Acquisition

on:
  pull_request:
    paths:
      - 'automation/CEW_OBJECT_ACQUISITION_CONTRACT_v1.json'
      - 'automation/CEW_OAR_G4_COLUMN_PILOT_INPUT_v1.json'
      - 'automation/CEW_OAR_G4_COLUMN_REGION_BINDING_v1.json'
      - 'scripts/cew_object_acquisition.py'
      - 'scripts/cew_object_workbench.py'
      - 'scripts/cew_oar_g4_column_pilot.py'
      - 'scripts/cew_oar_g4_audit_history.py'
      - 'scripts/cew_oar_g4_region_binding.py'
      - 'scripts/cew_oar_g4_region_workbench.py'
      - 'scripts/cew_oar_g4_region_workbench_base.py'
      - 'scripts/cew_oar_g4_source_resolver.py'
      - 'scripts/cew_source_evidence_workspace.py'
      - 'scripts/cew_professional_workbench_api.py'
      - 'scripts/cew_professional_workbench_api_base.py'
      - 'scripts/validate_cew_object_acquisition.py'
      - 'scripts/validate_cew_oar_g4_column_pilot.py'
      - 'scripts/validate_cew_oar_g4_audit_history.py'
      - 'scripts/validate_cew_oar_g4_region_binding.py'
      - 'scripts/validate_cew_oar_g4_region_workbench.py'
      - 'scripts/validate_cew_oar_g4_region_runtime.py'
      - 'data/canonical/tavole_originali_remote_index_v1.csv'
      - 'requirements.txt'
      - 'docs/architecture/CEW_OBJECT_ACQUISITION_AND_PROJECT_MATERIAL_PLAN_v1.md'
      - '.github/workflows/validate-cew-object-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-oar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile OAR modules
        run: >-
          python -m py_compile
          scripts/cew_object_acquisition.py
          scripts/cew_object_workbench.py
          scripts/cew_oar_g4_column_pilot.py
          scripts/cew_oar_g4_audit_history.py
          scripts/cew_oar_g4_region_binding.py
          scripts/cew_oar_g4_region_workbench.py
          scripts/cew_oar_g4_region_workbench_base.py
          scripts/cew_oar_g4_source_resolver.py
          scripts/cew_professional_workbench_api.py
          scripts/cew_professional_workbench_api_base.py
          scripts/validate_cew_object_acquisition.py
          scripts/validate_cew_oar_g4_column_pilot.py
          scripts/validate_cew_oar_g4_audit_history.py
          scripts/validate_cew_oar_g4_region_binding.py
          scripts/validate_cew_oar_g4_region_workbench.py
          scripts/validate_cew_oar_g4_region_runtime.py
      - name: Validate fail-closed OAR semantics
        working-directory: scripts
        run: python validate_cew_object_acquisition.py
      - name: Validate real G4 column pilot
        working-directory: scripts
        run: python validate_cew_oar_g4_column_pilot.py
      - name: Validate governed OAR audit-history pagination and reduction
        working-directory: scripts
        run: python validate_cew_oar_g4_audit_history.py
      - name: Validate governed G4 region localization
        working-directory: scripts
        run: python validate_cew_oar_g4_region_binding.py
      - name: Validate authenticated G4 region Workbench wiring
        working-directory: scripts
        run: python validate_cew_oar_g4_region_workbench.py
      - name: Install runtime and smoke-test dependencies
        run: pip install -r requirements.txt httpx2
      - name: Execute real G4 localization runtime smoke
        working-directory: scripts
        run: python validate_cew_oar_g4_region_runtime.py
      - name: Validate OAR contract is fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('automation/CEW_OBJECT_ACQUISITION_CONTRACT_v1.json').read_text())
          pilot = json.loads(Path('automation/CEW_OAR_G4_COLUMN_PILOT_INPUT_v1.json').read_text())
          binding = json.loads(Path('automation/CEW_OAR_G4_COLUMN_REGION_BINDING_v1.json').read_text())
          assert contract['authority']['canonical_write_authorized'] is False
          assert contract['authority']['structural_identity_authorized'] is False
          assert contract['promotion_policy']['structural_identity_is_separate_gate'] is True
          assert contract['pilot']['may_write_canonical_engineering_state'] is False
          assert pilot['semantic_audit']['identity_count'] == 34
          assert pilot['semantic_audit']['decision'] == 'PASS'
          assert pilot['cew_binding']['evidence_region_binding'] == 'MISSING_PER_OBJECT'
          assert pilot['authority']['human_confirmation'] is False
          assert pilot['authority']['canonical_write_authorized'] is False
          assert len(binding['objects']) == 34
          assert binding['document']['coordinate_system'] == 'NORMALIZED_0_1'
          assert binding['workflow']['interaction_surface'] == 'FULL_VERIFIED_PAGE'
          assert binding['workflow']['oar_classification_authority'] == 'SEPARATE_REVIEW_REQUIRED'
          assert binding['workflow']['canonical_write_authorized'] is False
          print('CEW_OBJECT_ACQUISITION_CONTRACT_PASS')
          PY
