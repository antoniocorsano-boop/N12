name: CEW Repository Memory Gate

on:
  pull_request:
    paths:
      - 'governance/repo-memory/**'
      - 'docs/repo-memory/**'
      - 'docs/superpowers/plans/**'
      - 'automation/validate_cew_repo_memory.py'
      - 'tests/test_cew_repo_memory.py'
      - '.github/workflows/validate-cew-repo-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repo-memory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Run repository-memory contracts
        run: python -m unittest tests.test_cew_repo_memory -v
      - name: Validate repository memory
        run: python automation/validate_cew_repo_memory.py
