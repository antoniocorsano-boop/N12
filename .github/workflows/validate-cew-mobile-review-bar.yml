name: Validate CEW Mobile Review Bar

on:
  pull_request:
    paths:
      - 'automation/CEW_MOBILE_REVIEW_FIXTURE_v1.json'
      - 'docs/experiments/2026-10-30-cew-mobile-review-bar-design.md'
      - 'docs/superpowers/plans/2026-10-30-cew-mobile-review-bar.md'
      - 'scripts/cew_mobile_review.py'
      - 'scripts/build_cew_mobile_review_pack.py'
      - 'scripts/validate_cew_mobile_review_bar.py'
      - 'scripts/cew_f7_native_review_service.py'
      - '.github/workflows/validate-cew-mobile-review-bar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-review-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile scripts/validate_cew_mobile_review_bar.py
          python -m py_compile scripts/cew_mobile_review.py
          python -m py_compile scripts/build_cew_mobile_review_pack.py
      - name: Validate smartphone-first review contract
        run: python scripts/validate_cew_mobile_review_bar.py
      - name: Build neutral smartphone fixture
        run: |
          python scripts/build_cew_mobile_review_pack.py \
            automation/CEW_MOBILE_REVIEW_FIXTURE_v1.json \
            --output artifacts/cew-mobile-review/index.html
      - name: Assert preview is non-authoritative
        run: |
          grep -F 'canonical_write_authorized:false' artifacts/cew-mobile-review/index.html
          grep -F 'canonical_write_performed:false' artifacts/cew-mobile-review/index.html
          grep -F 'env(safe-area-inset-bottom)' artifacts/cew-mobile-review/index.html
      - name: Upload smartphone preview
        uses: actions/upload-artifact@v4
        with:
          name: cew-mobile-review-preview
          path: artifacts/cew-mobile-review/
          if-no-files-found: error
          retention-days: 14
