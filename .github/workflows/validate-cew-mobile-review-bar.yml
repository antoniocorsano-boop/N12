name: Validate CEW Mobile Review Bar

on:
  pull_request:
    paths:
      - 'automation/CEW_MOBILE_REVIEW_FIXTURE_v1.json'
      - 'docs/experiments/2026-10-30-cew-mobile-review-bar-design.md'
      - 'docs/superpowers/plans/2026-10-30-cew-mobile-review-bar.md'
      - 'scripts/cew_mobile_review.py'
      - 'scripts/build_cew_mobile_review_pack.py'
      - 'scripts/build_cew_col02_mobile_manifest.py'
      - 'scripts/validate_cew_col02_mobile_adapter.py'
      - 'scripts/validate_cew_mobile_review_bar.py'
      - 'scripts/cew_mobile_review_service.py'
      - 'scripts/cew_f7_native_review_service.py'
      - '.github/workflows/validate-cew-mobile-review-bar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-review-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile scripts/validate_cew_mobile_review_bar.py
          python -m py_compile scripts/cew_mobile_review.py
          python -m py_compile scripts/build_cew_mobile_review_pack.py
          python -m py_compile scripts/cew_mobile_review_service.py
          python -m py_compile scripts/validate_cew_col02_mobile_adapter.py
      - name: Validate smartphone-first review contract
        run: python scripts/validate_cew_mobile_review_bar.py
      - name: Validate COL-02 adapter contract
        run: python scripts/validate_cew_col02_mobile_adapter.py
      - name: Build neutral smartphone fixture
        run: |
          python scripts/build_cew_mobile_review_pack.py \
            automation/CEW_MOBILE_REVIEW_FIXTURE_v1.json \
            --output artifacts/cew-mobile-review/index.html
      - name: Assert preview is non-authoritative
        run: |
          grep -F 'canonical_write_authorized:false' artifacts/cew-mobile-review/index.html
          grep -F 'canonical_write_performed:false' artifacts/cew-mobile-review/index.html
          grep -F 'env(safe-area-inset-bottom)' artifacts/cew-mobile-review/index.html
      - name: Prove native mobile route and inherited authority boundary
        run: |
          python scripts/cew_mobile_review_service.py \
            --host 127.0.0.1 \
            --port 8766 \
            --receipt-store /tmp/cew-mobile-review-receipts \
            --mobile-review-manifest automation/CEW_MOBILE_REVIEW_FIXTURE_v1.json \
            > /tmp/cew-mobile-review.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=1) as r:
                      health=json.load(r)
                  assert health['status']=='ok'
                  assert health['canonical_write'] is False
                  with urllib.request.urlopen('http://127.0.0.1:8766/review/mobile', timeout=1) as r:
                      page=r.read().decode('utf-8')
                  assert 'class="mobile-action-bar"' in page
                  assert page.count('<button class="primary-action" data-action="') == 4
                  assert 'canonical_write_authorized:false' in page
                  print('CEW_MOBILE_REVIEW_HTTP=PASS')
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise SystemExit('mobile review service did not become healthy')
          PY
      - name: Upload smartphone preview
        uses: actions/upload-artifact@v4
        with:
          name: cew-mobile-review-preview
          path: artifacts/cew-mobile-review/
          if-no-files-found: error
          retention-days: 14

  col02-real-candidates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact mobile candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Materialize frozen COL-02 producer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5664614d813cd11cf357bed40d7cdfaa843720f2
          git worktree add --detach "$RUNNER_TEMP/col02" 5664614d813cd11cf357bed40d7cdfaa843720f2
      - name: Install frozen exact-source toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5
          test "$(dpkg-query -W -f='${Version}' tesseract-ocr)" = '5.3.4-1build5'
          python -m venv "$RUNNER_TEMP/cew-col02"
          source "$RUNNER_TEMP/cew-col02/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/col02/requirements/cew-b01.lock.txt"
          python -m pip check
      - name: Rebuild frozen COL-02 occurrence evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/col02"
          git fetch --no-tags --depth=1 origin 78c20a52db4f391ce0d13b9705b9f04737e218c9
          source "$RUNNER_TEMP/cew-col02/bin/activate"
          python -m experiments.cew_col02.exact_source_audit
          python -m experiments.cew_col02.review_atlas evidence/cew-col02/footprint-text-binding/col02-audit.json
          python -m experiments.cew_col02.prototype_guided_exact_source
          python -m experiments.cew_col02.occurrence_sweep_exact_source
      - name: Build target-explicit mobile manifest from real COL-02 residuals
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cew-col02/bin/activate"
          python scripts/build_cew_col02_mobile_manifest.py \
            --evidence-root "$RUNNER_TEMP/col02/evidence/cew-col02/footprint-text-binding" \
            --producer-sha 5664614d813cd11cf357bed40d7cdfaa843720f2 \
            --output artifacts/cew-col02-mobile/manifest.json
          python scripts/build_cew_mobile_review_pack.py \
            artifacts/cew-col02-mobile/manifest.json \
            --output artifacts/cew-col02-mobile/index.html
      - name: Assert exact residual set and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'COL02-FP-0515','COL02-FP-0252','COL02-FP-0028','COL02-FP-0581','COL02-FP-0577',
              'COL02-FP-0605','COL02-FP-0490','COL02-FP-0106','COL02-FP-0572','COL02-FP-0243'
          }
          manifest=json.loads(Path('artifacts/cew-col02-mobile/manifest.json').read_text(encoding='utf-8'))
          assert len(manifest['candidates']) == 10
          assert {c['candidate_id'] for c in manifest['candidates']} == expected
          assert all(c['target']['candidate_id'] == c['candidate_id'] for c in manifest['candidates'])
          assert all(c['overlay_image_uri'].startswith('data:image/png;base64,') for c in manifest['candidates'])
          assert manifest['source']['producer_exact_sha'] == '5664614d813cd11cf357bed40d7cdfaa843720f2'
          print('CEW_COL02_REAL_MOBILE_MANIFEST=PASS')
          PY
          grep -F 'canonical_write_authorized:false' artifacts/cew-col02-mobile/index.html
          test "$(grep -o '<button class="primary-action" data-action="' artifacts/cew-col02-mobile/index.html | wc -l)" -eq 4
      - name: Upload real COL-02 smartphone preview
        uses: actions/upload-artifact@v4
        with:
          name: cew-col02-mobile-review-preview
          path: artifacts/cew-col02-mobile/
          if-no-files-found: error
          retention-days: 14
