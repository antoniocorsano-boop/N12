name: Diagnose CEW-COL-03D Raster Source

on:
  pull_request:
    branches:
      - feat/cew-col03c-governed-cross-document-materialization
    paths:
      - '.github/workflows/diagnose-cew-col03d-raster-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Search repository history for raster-generation clues
        run: |
          python - <<'PY'
          import subprocess
          needles = [
              '4060x2274','8222x1393','6731x1393',
              'TAV5_CARPENTERIA_raster','TAV6_TRAVI_raster','TAV7_PILASTRI_raster',
              '1.35','97.2','quality=95','jpg_quality=95',
          ]
          refs = subprocess.check_output(['git','for-each-ref','--format=%(refname)','refs/remotes/origin'], text=True).splitlines()
          for needle in needles:
              hits=[]
              for ref in refs:
                  proc=subprocess.run(['git','grep','-n','-F',needle,ref,'--','*.py','*.md','*.txt','*.yml','*.yaml'],text=True,capture_output=True)
                  if proc.stdout:
                      hits.extend(proc.stdout.splitlines()[:20])
              print('NEEDLE',needle,'HITS',hits[:50])
          PY
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Materialize archived source PDFs
        run: |
          mkdir -p /tmp/col03d-raster-source
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:'archive/documentazione_originaria/tavola 5.pdf' > /tmp/col03d-raster-source/tavola5.pdf
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:'archive/documentazione_originaria/tavola 6.pdf' > /tmp/col03d-raster-source/tavola6.pdf
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:'archive/documentazione_originaria/tavola7.pdf' > /tmp/col03d-raster-source/tavola7.pdf
      - name: Install read-only raster inspector
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5 Pillow==13.0.0
      - name: Compare rendered RGB pixels with historical raster pixels
        run: |
          python - <<'PY'
          import fitz
          import hashlib
          from pathlib import Path
          from PIL import Image

          EXPECTED = {
              'tavola5.pdf': ((4060,2274), 'adeccc645272b547a584b81ae5caaeb33c3a39f96384bb601434f828ad2afea1'),
              'tavola6.pdf': ((8222,1393), 'f2e06fddc3e2e9d2b5498ba1f902e3df461515b87096b974b126b7237e7777a5'),
              'tavola7.pdf': ((6731,1393), 'a03c1f1a2730b6118adb525da515456fce3f5438ca5a8b11c0a8e857839db686'),
          }
          root=Path('/tmp/col03d-raster-source')
          for filename,(dims,expected_rgb_sha) in EXPECTED.items():
              doc=fitz.open(root/filename); page=doc[0]
              pix=page.get_pixmap(matrix=fitz.Matrix(1.35,1.35),alpha=False)
              base=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
              candidates={
                  'R90': base.transpose(Image.Transpose.ROTATE_90),
                  'R270': base.transpose(Image.Transpose.ROTATE_270),
              }
              print('PDF',filename,'EXPECTED_DIMS',dims,'EXPECTED_RGB_SHA',expected_rgb_sha)
              for name,img in candidates.items():
                  raw=img.tobytes()
                  digest=hashlib.sha256(raw).hexdigest()
                  print('RAW_RGB',name,'DIMS',img.size,'SHA',digest,'MATCH',digest==expected_rgb_sha)

              for angle in (90,-90,270):
                  rp=page.get_pixmap(matrix=fitz.Matrix(1.35,1.35).prerotate(angle),alpha=False)
                  digest=hashlib.sha256(rp.samples).hexdigest()
                  print('MUPDF_RAW',angle,'DIMS',(rp.width,rp.height),'SHA',digest,'MATCH',digest==expected_rgb_sha)
          PY
