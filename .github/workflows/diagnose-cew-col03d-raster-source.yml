name: Diagnose CEW-COL-03D Raster Source

on:
  pull_request:
    branches:
      - feat/cew-col03c-governed-cross-document-materialization
    paths:
      - '.github/workflows/diagnose-cew-col03d-raster-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Search all fetched refs for historical package/raster blobs
        run: |
          python - <<'PY'
          import subprocess

          names = {
              'Ariano_Irpino_DXF_strutturale_v25.zip',
              'Ariano_Irpino_DXF_strutturale_v25(1).zip',
              'TAV5_CARPENTERIA_raster.jpg',
              'TAV6_TRAVI_raster.jpg',
              'TAV7_PILASTRI_raster.jpg',
          }
          target_sizes = {5345286, 1701955, 1658546, 1658463}
          refs = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname)', 'refs/remotes/origin'], text=True
          ).splitlines()
          exact_name_hits = []
          exact_size_hits = []
          for ref in refs:
              listing = subprocess.check_output(['git', 'ls-tree', '-rl', ref], text=True, errors='replace')
              for line in listing.splitlines():
                  if '\t' not in line:
                      continue
                  meta, path = line.split('\t', 1)
                  parts = meta.split()
                  if len(parts) < 4 or parts[1] != 'blob':
                      continue
                  try:
                      size = int(parts[3])
                  except ValueError:
                      continue
                  basename = path.rsplit('/', 1)[-1]
                  if basename in names:
                      exact_name_hits.append((ref, path, size, parts[2]))
                  if size in target_sizes:
                      exact_size_hits.append((ref, path, size, parts[2]))
          print('EXACT_NAME_HITS', exact_name_hits)
          print('EXACT_SIZE_HITS', exact_size_hits)
          PY
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Materialize archived source PDFs
        run: |
          mkdir -p /tmp/col03d-raster-source
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:'archive/documentazione_originaria/tavola 5.pdf' > /tmp/col03d-raster-source/tavola5.pdf
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:'archive/documentazione_originaria/tavola 6.pdf' > /tmp/col03d-raster-source/tavola6.pdf
          git show 78c20a52db4f391ce0d13b9705b9f04737e218c9:'archive/documentazione_originaria/tavola7.pdf' > /tmp/col03d-raster-source/tavola7.pdf
          sha256sum /tmp/col03d-raster-source/*.pdf
      - name: Install read-only raster inspectors
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5 Pillow
      - name: Audit embedded raster candidates and deterministic transforms
        run: |
          python - <<'PY'
          import fitz
          import hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, __version__ as PILLOW_VERSION

          EXPECTED = {
              'tavola5.pdf': ((4060, 2274), '20810b04fa96d4a12d2c93767ae3f205b69e0abe34749567e362989601875e02'),
              'tavola6.pdf': ((8222, 1393), 'fe6a29b74d3c8abefae0e3ac50bd3db94ab8aa23949197b4970e21442e04a8ad'),
              'tavola7.pdf': ((6731, 1393), 'd56fd2feb2849e237af94f7af46efc591c4c2cdbad828618565621e7288a3595'),
          }
          RESAMPLERS = {
              'NEAREST': Image.Resampling.NEAREST,
              'BOX': Image.Resampling.BOX,
              'BILINEAR': Image.Resampling.BILINEAR,
              'HAMMING': Image.Resampling.HAMMING,
              'BICUBIC': Image.Resampling.BICUBIC,
              'LANCZOS': Image.Resampling.LANCZOS,
          }
          ROTATIONS = {
              'R90': Image.Transpose.ROTATE_90,
              'R270': Image.Transpose.ROTATE_270,
          }
          root = Path('/tmp/col03d-raster-source')
          print('PILLOW_VERSION', PILLOW_VERSION)
          for filename, (expected_dims, expected_sha) in EXPECTED.items():
              doc = fitz.open(root / filename)
              page = doc[0]
              print('PDF', filename, 'PAGE_RECT', tuple(page.rect), 'ROTATION', page.rotation)
              images = page.get_images(full=True)
              if len(images) != 1:
                  raise SystemExit(f'EXPECTED_ONE_EMBEDDED_IMAGE:{filename}:{len(images)}')
              extracted = doc.extract_image(images[0][0])
              raw = extracted['image']
              print('EMBEDDED', extracted.get('ext'), extracted.get('width'), extracted.get('height'), len(raw), hashlib.sha256(raw).hexdigest())
              source = Image.open(BytesIO(raw)).convert('RGB')
              matches = []
              attempts = 0
              for rotation_name, transpose in ROTATIONS.items():
                  rotated = source.transpose(transpose)
                  for resample_name, resample in RESAMPLERS.items():
                      resized = rotated.resize(expected_dims, resample=resample)
                      for optimize in (False, True):
                          buf = BytesIO()
                          resized.save(
                              buf,
                              format='JPEG',
                              quality=95,
                              subsampling=2,
                              optimize=optimize,
                              progressive=False,
                          )
                          data = buf.getvalue()
                          digest = hashlib.sha256(data).hexdigest()
                          attempts += 1
                          if digest == expected_sha:
                              matches.append((rotation_name, resample_name, optimize, len(data), digest))
              print('TRANSFORM_ATTEMPTS', attempts, 'TARGET_DIMS', expected_dims, 'EXPECTED_SHA', expected_sha)
              print('EXACT_TRANSFORM_MATCHES', matches)
          PY
