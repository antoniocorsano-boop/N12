name: CEW-COL-03D Historical Package Recovery

on:
  pull_request:
    branches:
      - feat/cew-col03c-governed-cross-document-materialization
    paths:
      - 'archive/historical_packages/v25/**'
      - 'experiments/cew_col03d/**'
      - 'tests/cew_col03d/**'
      - '.github/workflows/validate-cew-col03d-historical-package-recovery.yml'
      - 'docs/superpowers/specs/2026-11-01-cew-col03d-historical-package-recovery-design.md'
      - 'docs/superpowers/plans/2026-11-01-cew-col03d-historical-package-recovery.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Run COL-03D package-source contract
        run: python -m pytest -q tests/cew_col03d/test_package_source.py
