name: Measure CEW TAV05S Pilot Page

on:
  pull_request:
    paths:
      - 'scripts/measure_cew_tav05s_pilot_page.py'
      - '.github/workflows/measure-cew-tav05s-pilot-page.yml'
  push:
    branches:
      - 'work/cew-oa5-structural-resolver-v1'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install 'PyMuPDF==1.26.4'
      - name: Verify and measure immutable TAV-05S
        run: python scripts/measure_cew_tav05s_pilot_page.py
