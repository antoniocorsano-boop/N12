name: Validate CEW Netlify Audit

on:
  pull_request:
    paths:
      - 'app.py'
      - 'scripts/cew_runtime_audit_store.py'
      - 'scripts/validate_cew_netlify_audit.py'
      - 'netlify.toml'
      - 'netlify/**'
      - 'package.json'
      - '.github/workflows/validate-cew-netlify-audit.yml'
      - 'data/canonical/CEW_PROJECT_STATE_CURRENT_v1.json'
      - 'knowledge/ARTIFACT_REGISTRY_CEW_PROMOTION_ENGINE_PATCH_v1.csv'
  push:
    branches:
      - work/cew-f5-knowledge-graph-from-e7c0
      - work/cew-netlify-audit
    paths:
      - 'app.py'
      - 'scripts/cew_runtime_audit_store.py'
      - 'scripts/validate_cew_netlify_audit.py'
      - 'netlify.toml'
      - 'netlify/**'
      - 'package.json'
      - '.github/workflows/validate-cew-netlify-audit.yml'

jobs:
  audit-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python runtime
        run: pip install -r requirements.txt
      - name: Install Netlify Database runtime
        run: npm install --ignore-scripts
      - name: Python syntax
        run: python -m py_compile app.py scripts/cew_runtime_audit_store.py scripts/validate_cew_netlify_audit.py
      - name: Netlify function syntax
        run: node --check netlify/functions/cew-audit.mjs
      - name: Validate Netlify audit bridge
        run: python scripts/validate_cew_netlify_audit.py
      - name: Preserve native F7 review authority
        run: python scripts/validate_cew_f7_native_review_service.py
