<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    .f{fill:none;stroke:#111;stroke-width:3}.d{fill:none;stroke:#666;stroke-width:1.5}.n{font:28px sans-serif;fill:#111}.s{font:20px sans-serif;fill:#333}.t{font:bold 26px sans-serif;fill:#111}.warn{font:18px sans-serif;fill:#8a3b00}
  </style>
  <text x="40" y="45" class="t">Telaio 5 — traccia planimetrica persistente RIF</text>
  <text x="40" y="75" class="warn">Derivata dall'immagine utente del 19/08/2026. Non sostituisce la fonte fotografica originale.</text>
  <text x="40" y="105" class="s">Percorso verificato: S–S′–T–U–V–Z–A′–B′–C′</text>

  <!-- schematic structural path, intentionally not metric in Y -->
  <polyline class="f" points="100,270 260,270 400,270 470,330 650,470 760,470 820,470 980,470 1100,470"/>
  <line class="f" x1="100" y1="270" x2="100" y2="120"/>
  <line class="f" x1="260" y1="270" x2="260" y2="120"/>
  <line class="f" x1="400" y1="270" x2="400" y2="120"/>
  <line class="f" x1="470" y1="330" x2="470" y2="160"/>
  <line class="f" x1="650" y1="470" x2="650" y2="300"/>
  <line class="f" x1="760" y1="470" x2="760" y2="300"/>
  <line class="f" x1="820" y1="470" x2="820" y2="300"/>
  <line class="f" x1="980" y1="470" x2="980" y2="300"/>
  <line class="f" x1="1100" y1="470" x2="1100" y2="300"/>

  <circle cx="100" cy="270" r="7" fill="#111"/><text x="78" y="310" class="n">S</text>
  <circle cx="260" cy="270" r="7" fill="#111"/><text x="238" y="310" class="n">S′</text>
  <circle cx="400" cy="270" r="7" fill="#111"/><text x="387" y="310" class="n">T</text>
  <circle cx="470" cy="330" r="7" fill="#111"/><text x="450" y="370" class="n">U</text>
  <circle cx="650" cy="470" r="7" fill="#111"/><text x="630" y="510" class="n">V</text>
  <circle cx="760" cy="470" r="7" fill="#111"/><text x="744" y="510" class="n">Z</text>
  <circle cx="820" cy="470" r="7" fill="#111"/><text x="795" y="510" class="n">A′</text>
  <circle cx="980" cy="470" r="7" fill="#111"/><text x="955" y="510" class="n">B′</text>
  <circle cx="1100" cy="470" r="7" fill="#111"/><text x="1075" y="510" class="n">C′</text>

  <!-- documentary projected stations -->
  <line class="d" x1="80" y1="650" x2="1120" y2="650"/>
  <g class="s">
    <text x="75" y="690">0.00</text>
    <text x="225" y="690">4.70</text>
    <text x="365" y="690">8.75</text>
    <text x="455" y="690">9.95</text>
    <text x="625" y="690">15.75</text>
    <text x="735" y="690">18.65</text>
    <text x="800" y="690">19.85</text>
    <text x="950" y="690">23.90</text>
    <text x="1070" y="690">28.60 m</text>
  </g>
  <text x="40" y="740" class="s">Stazioni documentali congelate: 0.00 / 4.70 / 8.75 / 9.95 / 15.75 / 18.65 / 19.85 / 23.90 / 28.60 m</text>
  <text x="40" y="775" class="s">Mapping G4: S=P17; S′=P18; T=P19; U=P20; V=P21; Z=P22; A′=P22′; B′=P23; C′=P24.</text>
  <text x="40" y="810" class="s">Uso: memoria/QA e rebinding. Coordinate verticali del disegno sono schematiche; non usare come geometria M0-G.</text>
</svg>
