services:
  - type: web
    name: cew-hva-candidate
    runtime: python
    plan: free
    region: frankfurt
    branch: work/cew-b18-human-centred-acceptance-v2-render
    autoDeployTrigger: off
    buildCommand: bash scripts/render_build_candidate.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: CEW_RUNTIME_ROLE
        value: CANDIDATE_HVA
      - key: CEW_R2HR_STRICT_RUNTIME
        value: "1"
      - key: CEW_AUTH_DISABLED_FOR_TEST
        value: "0"
      - key: CEW_ACCESS_PASSWORD
        sync: false
      - key: CEW_SESSION_SECRET
        generateValue: true
      - key: CEW_AUDIT_NEON_DATABASE_URL
        sync: false
